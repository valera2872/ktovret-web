<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ночной городской двор и материалы расследования</title>
  <desc id="desc">Стилизованная тёмная иллюстрация: кирпичная стена, пожарная лестница, освещённое окно и папка с материалами дела.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111b"/>
      <stop offset=".55" stop-color="#0b1b29"/>
      <stop offset="1" stop-color="#02070c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a38"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#f3d08b" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#c99347" stop-opacity=".45"/>
      <stop offset="1" stop-color="#c99347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7c9ae"/>
      <stop offset="1" stop-color="#a99a80"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="brick" width="120" height="54" patternUnits="userSpaceOnUse">
      <path d="M0 0h120v54H0z" fill="none"/>
      <path d="M0 0h120M0 54h120M0 27h120M60 0v27M30 27v27M90 27v27" stroke="#d7e1e6" stroke-opacity=".055" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="1240" cy="255" rx="330" ry="270" fill="url(#windowGlow)" opacity=".32" filter="url(#soft)"/>

  <g opacity=".98">
    <path d="M640 0h960v780H640z" fill="url(#wall)"/>
    <path d="M640 0h960v780H640z" fill="url(#brick)"/>
    <path d="M748 0v780M1180 0v780" stroke="#031018" stroke-opacity=".7" stroke-width="20"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1138" y="170" width="230" height="270" rx="7" fill="#061018" stroke="#4a5154" stroke-width="10"/>
    <rect x="1164" y="196" width="178" height="218" fill="#e8be70"/>
    <rect x="1178" y="210" width="150" height="190" fill="#efd59d"/>
    <path d="M1253 233v167M1178 306h150" stroke="#86662f" stroke-opacity=".45" stroke-width="8"/>
    <ellipse cx="1250" cy="324" rx="45" ry="72" fill="#152028" opacity=".72"/>
    <circle cx="1250" cy="240" r="24" fill="#152028" opacity=".72"/>
  </g>

  <g fill="none" stroke="#8a9498" stroke-width="11" opacity=".9">
