    <path d="M425 242l52-58 32 29 47-76" stroke="#caa85f" stroke-opacity=".66" stroke-width="5" fill="none"/>
    <circle cx="478" cy="184" r="7" fill="#e2c386"/>
    <circle cx="510" cy="213" r="7" fill="#e2c386"/>
    <circle cx="557" cy="137" r="7" fill="#e2c386"/>
    <rect x="70" y="303" width="206" height="22" rx="11" fill="#7b2f2c" opacity=".45"/>
    <circle cx="585" cy="319" r="33" fill="none" stroke="#7b2f2c" stroke-opacity=".45" stroke-width="5"/>
  </g>

  <g transform="translate(1110 690) rotate(7 150 110)" filter="url(#shadow)">
    <rect width="300" height="220" rx="10" fill="#d8cfbd"/>
    <rect x="19" y="19" width="262" height="160" rx="4" fill="#0b151d"/>
    <path d="M34 159L82 116l35 21 47-65 43 41 60-55" stroke="#c8a45f" stroke-opacity=".72" stroke-width="5" fill="none"/>
    <rect x="105" y="204" width="92" height="5" rx="3" fill="#5d5548" opacity=".6"/>
  </g>

  <g opacity=".92">
    <circle cx="1476" cy="850" r="86" fill="none" stroke="#d7b36f" stroke-opacity=".24" stroke-width="3"/>
    <circle cx="1476" cy="850" r="48" fill="none" stroke="#d7b36f" stroke-opacity=".16" stroke-width="2"/>
    <path d="M1448 847l20 20 39-47" fill="none" stroke="#d7b36f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect width="1600" height="1000" fill="none" stroke="#e0bd76" stroke-opacity=".12" stroke-width="2"/>
</svg>