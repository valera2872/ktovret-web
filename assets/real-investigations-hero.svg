    <path d="M766 210v430M1132 180v470M1288 395v300"/>
    <path d="M785 418l336-180M832 606l385-182M1000 606l240-125"/>
    <path d="M746 258h42M746 298h42M746 338h42M746 378h42M1111 256h42M1111 296h42M1111 336h42M1111 376h42" stroke-width="6"/>
  </g>

  <g opacity=".32">
    <path d="M0 820C220 700 405 760 625 688c208-69 302-123 540-67 187 44 308 34 435-18v397H0z" fill="#000"/>
    <circle cx="147" cy="138" r="128" fill="#254258"/>
