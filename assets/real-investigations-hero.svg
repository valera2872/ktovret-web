    <rect x="0" y="0" width="670" height="390" rx="18" fill="#15191a"/>
    <rect x="22" y="22" width="626" height="346" rx="10" fill="url(#paper)"/>
    <rect x="22" y="22" width="626" height="62" rx="10" fill="#b7a78b"/>
    <path d="M72 126h480M72 171h355M72 216h450M72 261h300" stroke="#263038" stroke-opacity=".34" stroke-width="7"/>
