name: TEMP AI-02 Premium v6 exact E2E

on:
  push:
    paths:
      - '.github/workflows/temp-ai02-premium-v6-e2e.yml'

permissions:
  contents: read

jobs:
  exact-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run premium v6 stages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai02-full-chain-qa-probe?run=pv6-check&stage='
          run_stage () {
            local stage="$1"
            echo "=== $stage ==="
            body="$(curl -fsS --retry 2 --max-time 45 "${BASE}${stage}")"
            echo "$body"
            BODY="$body" node -e 'const j=JSON.parse(process.env.BODY); if(j.pass!==true){console.error("FAIL",j); process.exit(1)}'
          }
          run_stage abuse
          sleep 70
          run_stage chain1
          sleep 70
          run_stage chain2
          sleep 70
          run_stage chain3
          sleep 70
          run_stage chain4
          sleep 70
          run_stage final
