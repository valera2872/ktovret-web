name: TEMP AI-02 hardening contracts

on:
  push:
    branches:
      - fix/ai02-release-gate-abuse-20261003
    paths:
      - '.github/workflows/temp-ai02-hardening-contract.yml'
      - 'supabase/functions/ai-interrogation-v2/index.ts'
      - 'supabase/functions/_shared/ai-case-runtime.ts'
      - 'tests/ai-interrogation-v2-endpoint-contract.mjs'
      - 'tests/ai-interrogation-v2-foundation-contract.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run AI v2 contracts
        run: |
          node tests/ai-interrogation-v2-endpoint-contract.mjs
          node tests/ai-interrogation-v2-foundation-contract.mjs
