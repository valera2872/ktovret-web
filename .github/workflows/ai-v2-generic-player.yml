name: AI v2 generic player

on:
  pull_request:
    paths:
      - 'ai-investigation/**'
      - 'assets/ai-case-player-v2.js'
      - 'assets/ai-case-player-v2.css'
      - 'tests/ai-v2-generic-player-contract.mjs'
      - '.github/workflows/ai-v2-generic-player.yml'
  push:
    branches: [main]
    paths:
      - 'ai-investigation/**'
      - 'assets/ai-case-player-v2.js'
      - 'assets/ai-case-player-v2.css'
      - 'tests/ai-v2-generic-player-contract.mjs'
      - '.github/workflows/ai-v2-generic-player.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser client
        run: node --check assets/ai-case-player-v2.js
      - name: Verify server-authoritative generic player
        run: node tests/ai-v2-generic-player-contract.mjs
