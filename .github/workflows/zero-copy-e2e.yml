name: Zero Copy E2E
on:
  push:
    branches: [feature/zero-copy-runtime-final]
    paths:
      - 'qa-zero-copy/e2e.mjs'
      - '.github/workflows/zero-copy-e2e.yml'
  workflow_dispatch:
jobs:
  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run two-player E2E against production Supabase
        run: node qa-zero-copy/e2e.mjs
# Browser UI for the frozen exact client is intentionally validated by
# zero-copy-build19-exact.yml / isolated mocked-transport visual workflows.
# Production CORS does not allow localhost after QA cleanup.
