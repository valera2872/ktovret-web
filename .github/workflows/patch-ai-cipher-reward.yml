name: Patch AI detective cipher reward

on:
  push:
    branches: [feature/ai-detective-cipher-reward]
    paths:
      - 'tools/patch-ai-cipher-reward.mjs'
      - '.github/workflows/patch-ai-cipher-reward.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-detective-cipher-reward
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair one-shot patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/patch-ai-cipher-reward.mjs')
          s=p.read_text()
          s=s.replace('${MAX_TURNS}', r'\${MAX_TURNS}')
          s=s.replace('${state.turns}', r'\${state.turns}')
          s=re.sub(
              r"test=replaceOnce\(test,/assert\\\.match[\s\S]*?'cache contract'\);",
              "test=test;",
              s,
              count=1
          )
          p.write_text(s)
          PY
      - name: Patch post-confession cipher reward
        run: node tools/patch-ai-cipher-reward.mjs
      - name: Align transition contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/ai-detective-vslice-contract.mjs')
          s=p.read_text()
          s=s.replace("assert.match(html,/ai-detective-vslice\\.js\\?v=0\\.3\\.4/,'case-finale client must have a fresh cache key');","assert.match(html,/ai-detective-vslice\\.js\\?v=0\\.3\\.5/,'cipher-reward client must have a fresh cache key');")
          s=s.replace("assert.match(html,/data-action=\"theory-inline\">Оформить обвинение/,'confession transition must give the player a clear next action');","assert.match(html,/data-action=\"bonus-inline\">Открыть пакет C/,'confession transition must give the player an immediate reward action');")
          s=s.replace("assert.match(client,/Признание получено · оформите обвинение/,'confession must visibly end interrogation and point to accusation');","assert.match(client,/Дело раскрыто · пакет C открыт/,'confession must visibly end interrogation and point to the earned reward');")
          p.write_text(s)
          PY
      - name: Validate patched files
        run: |
          node --check assets/ai-detective-vslice.js
          node tests/ai-detective-vslice-contract.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add detektivnaya-igra-s-ii/index.html assets/ai-detective-vslice.js assets/ai-detective-vslice.css tests/ai-detective-vslice-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Reward solved AI case with cipher fragment'
          git push origin HEAD:feature/ai-detective-cipher-reward
