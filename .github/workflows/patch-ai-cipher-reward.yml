name: Patch AI detective cipher reward

on:
  push:
    branches: [feature/ai-detective-cipher-reward]
    paths:
      - 'tools/patch-ai-cipher-reward.mjs'
      - '.github/workflows/patch-ai-cipher-reward.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-detective-cipher-reward
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch post-confession cipher reward
        run: node tools/patch-ai-cipher-reward.mjs
      - name: Validate patched files
        run: |
          node --check assets/ai-detective-vslice.js
          node tests/ai-detective-vslice-contract.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add detektivnaya-igra-s-ii/index.html assets/ai-detective-vslice.js assets/ai-detective-vslice.css tests/ai-detective-vslice-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Reward solved AI case with cipher fragment'
          git push origin HEAD:feature/ai-detective-cipher-reward
