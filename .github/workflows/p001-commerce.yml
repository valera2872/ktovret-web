name: Validate P001 commerce fixtures
on:
  pull_request:
    paths:
      - 'supabase/functions/create-checkout-solo/**'
      - 'supabase/functions/payment-status-solo/**'
      - 'supabase/functions/tbank-webhook-solo/**'
      - 'tools/p001-commerce.test.mjs'
      - '.github/workflows/p001-commerce.yml'
permissions:
  contents: read
jobs:
  commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tools/p001-commerce.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          deno check --node-modules-dir=auto supabase/functions/create-checkout-solo/index.ts
          deno check --node-modules-dir=auto supabase/functions/payment-status-solo/index.ts
          deno check --node-modules-dir=auto supabase/functions/tbank-webhook-solo/index.ts
