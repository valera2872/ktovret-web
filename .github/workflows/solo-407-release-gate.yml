name: Validate Solo 407 Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solo-407-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited tree
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate runtime syntax
        run: |
          node --check assets/case-407-solo.js
          node --check assets/case-407-solo-progressive-entry.js
          node --check tools/import-mobile/solo-407-postprocess.mjs
          node --check tools/import-mobile/solo-407-player-feedback-postprocess.mjs
          node --check tools/validate-solo-407.mjs
          node --check tools/validate-solo-407-release-gate.mjs
          node --check tools/solo-407-browser-smoke.mjs
          node --check tools/solo-407-progressive-smoke.mjs

      - name: Validate Solo product contract
        run: node tools/validate-solo-407.mjs

      - name: Run adversarial G0-G8 audit
        run: node tools/validate-solo-407-release-gate.mjs

      - name: Run existing black-box solve and visual smoke
        run: node tools/solo-407-browser-smoke.mjs

      - name: Run progressive-entry black-box and visual smoke
        run: node tools/solo-407-progressive-smoke.mjs

      - name: Regression-check existing two-player spoiler boundaries
        run: node tools/validate-two-player-release-gate.mjs

      - name: Upload audited Solo screenshots and reports
        uses: actions/upload-artifact@v4
        with:
          name: solo-407-release-gate-${{ github.sha }}
          path: |
            artifacts/solo-407
            artifacts/solo-407-progressive
          retention-days: 14
          if-no-files-found: error
