name: AI avatar provider adapter

on:
  pull_request:
    paths:
      - 'admin/ai01-live-preview/**'
      - 'assets/review-admin.css'
      - 'assets/ai-avatar-auth-bootstrap.js'
      - 'assets/ai-avatar-provider.js'
      - 'assets/ai-liveavatar-factory.js'
      - 'assets/ai-detective-avatar-stage.css'
      - 'assets/vendor/liveavatar-web-sdk.mjs'
      - 'tools/ai-liveavatar-sdk-entry.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'detektivnaya-igra-s-ii/**'
      - 'supabase/functions/_shared/ai-avatar-profile.ts'
      - 'supabase/functions/ai-avatar-session/**'
      - 'supabase/functions/ai-avatar-tts/**'
      - 'supabase/migrations/20260830132613_ai_case_avatar_profiles.sql'
      - 'supabase/migrations/20260830144423_allow_draft_avatar_profiles_without_identity.sql'
      - 'tests/ai01-live-preview-layout-contract.mjs'
      - 'tests/ai-avatar-provider-contract.mjs'
      - 'tests/ai-avatar-profile-release-contract.mjs'
      - '.github/workflows/ai-avatar-provider.yml'
  push:
    branches: [main]
    paths:
      - 'admin/ai01-live-preview/**'
      - 'assets/review-admin.css'
      - 'assets/ai-avatar-auth-bootstrap.js'
      - 'assets/ai-avatar-provider.js'
      - 'assets/ai-liveavatar-factory.js'
      - 'assets/ai-detective-avatar-stage.css'
      - 'assets/vendor/liveavatar-web-sdk.mjs'
      - 'tools/ai-liveavatar-sdk-entry.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'detektivnaya-igra-s-ii/**'
      - 'supabase/functions/_shared/ai-avatar-profile.ts'
      - 'supabase/functions/ai-avatar-session/**'
      - 'supabase/functions/ai-avatar-tts/**'
      - 'supabase/migrations/20260830132613_ai_case_avatar_profiles.sql'
      - 'supabase/migrations/20260830144423_allow_draft_avatar_profiles_without_identity.sql'
      - 'tests/ai01-live-preview-layout-contract.mjs'
      - 'tests/ai-avatar-provider-contract.mjs'
      - 'tests/ai-avatar-profile-release-contract.mjs'
      - '.github/workflows/ai-avatar-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime syntax
        run: |
          node --check assets/ai-avatar-auth-bootstrap.js
          node --check assets/ai-avatar-provider.js
          node --check assets/ai-liveavatar-factory.js
          node --check assets/vendor/liveavatar-web-sdk.mjs
          node --check tools/ai-liveavatar-sdk-entry.mjs
      - name: Provider-neutral security contract
        run: node tests/ai-avatar-provider-contract.mjs
      - name: Owner preview viewport contract
        run: node tests/ai01-live-preview-layout-contract.mjs
      - name: Avatar profile release contract
        run: node tests/ai-avatar-profile-release-contract.mjs
      - name: Verify vendored pinned LiveAvatar SDK bundle
        run: |
          set -euo pipefail
          test -s assets/vendor/liveavatar-web-sdk.mjs
          git hash-object assets/vendor/liveavatar-web-sdk.mjs > /tmp/liveavatar-sdk-before
          npm install --no-audit --no-fund
          npm run build:avatar-sdk
          test -s assets/vendor/liveavatar-web-sdk.mjs
          git hash-object assets/vendor/liveavatar-web-sdk.mjs > /tmp/liveavatar-sdk-after
          diff -u /tmp/liveavatar-sdk-before /tmp/liveavatar-sdk-after
          git diff --exit-code -- assets/vendor/liveavatar-web-sdk.mjs
