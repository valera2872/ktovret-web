name: Validate Mystery Logic Last Aria

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KTOVRET_SOURCE_COMMIT: a2ad0f80e70beeb91d478f0bcf98d0ea31cc05dd
  KTOVRET_SOURCE_TOKEN: ${{ secrets.KTOVRET_SOURCE_TOKEN }}

jobs:
  validate-last-aria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: web
      - name: Require private source token
        run: test -n "$KTOVRET_SOURCE_TOKEN" || (echo "KTOVRET_SOURCE_TOKEN is required" && exit 1)
      - name: Checkout private mobile content
        uses: actions/checkout@v4
        with:
          repository: valera2872/ktovret
          ref: ${{ env.KTOVRET_SOURCE_COMMIT }}
          path: mobile-source
          persist-credentials: false
          token: ${{ env.KTOVRET_SOURCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Last Aria source and commerce boundary
        working-directory: web
        run: |
          set -euo pipefail
          node --check assets/case-aria-data.js
          node --check assets/case-aria-fairplay-v2.js
          node --check assets/case-aria-investigator-v16.js
          node --check assets/case-aria.js
          node --check assets/case-aria-materials-v2.js
          node --check assets/case-aria-storefront.js
          node --check assets/case-aria-paid-auth.js
          test -s assets/case-aria-materials-v2.css
          test -s assets/case-aria-layout-v2.css
          test -s assets/case-aria-storefront.css
          node --check tools/import-mobile/two-player-last-aria-postprocess.mjs
          node --check tools/validate-case-last-aria.mjs
          node --check tools/validate-case-last-aria-countertheories.mjs
          node --check tools/validate-coop-last-aria-backend.mjs
          node --check tools/last-aria-browser-smoke.mjs
          grep -q "functions/v1/coop-last-aria" assets/case-aria.js
          grep -q "const PRICE_RUB = 299" assets/case-aria-storefront.js
          grep -q "const REVIEW_PRICE_RUB = 249" assets/case-aria-storefront.js
          grep -q "const PRODUCT_ID = 'last_aria'" assets/case-aria-storefront.js
          grep -q "create-checkout-last-aria" assets/case-aria-storefront.js
          grep -q "payment-status-last-aria" assets/case-aria-storefront.js
          grep -q "LAST_ARIA_PRODUCT_ID = 'last_aria'" supabase/functions/_shared/last-aria-commerce.ts
          grep -q "LAST_ARIA_PRICE_RUB = 299" supabase/functions/_shared/last-aria-commerce.ts
          grep -q "tbank-webhook-last-aria" supabase/functions/create-checkout-last-aria/index.ts
          grep -q "eq('product_id', LAST_ARIA_PRODUCT_ID)" supabase/functions/payment-status-last-aria/index.ts
          grep -q "eq('product_id', LAST_ARIA_PRODUCT_ID)" supabase/functions/tbank-webhook-last-aria/index.ts

          # The independent Who Lied storefront must remain on the restored offer.
          grep -q "productId:'volume1'" assets/paid-access-config.js
          grep -q "volume1:{label:'Полный архив «Кто врёт?»',priceRub:199,caseCount:85}" assets/paid-access-config.js
          ! grep -q "volume2:" assets/paid-access-config.js
          ! grep -q "volume_bundle_1_2:" assets/paid-access-config.js
          grep -q "tokenStorageKey:'mysterylogic:volume1:access-token'" assets/paid-access-config.js

      - name: Validate backend transport contract
        working-directory: web
        run: node tools/validate-coop-last-aria-backend.mjs
      - name: Adversarial Holmes-Poirot validation
        working-directory: web
        run: node tools/validate-case-last-aria.mjs
      - name: Reject principal counter-theories
        working-directory: web
        run: node tools/validate-case-last-aria-countertheories.mjs

      - name: Generate full public site
        working-directory: web
        run: node tools/import-mobile-cases.mjs --source ../mobile-source --site . --mode public --commit "$KTOVRET_SOURCE_COMMIT"

      - name: Validate generated Last Aria and restored catalog
        working-directory: web
        run: |
          set -euo pipefail
          test -f detektivnye-igry-dlya-dvoih/poslednyaya-ariya/index.html
          grep -q 'name="robots" content="noindex,follow"' detektivnye-igry-dlya-dvoih/poslednyaya-ariya/index.html
          grep -q 'case-aria-storefront.css' detektivnye-igry-dlya-dvoih/poslednyaya-ariya/index.html
          grep -q 'case-aria-paid-auth.js' detektivnye-igry-dlya-dvoih/poslednyaya-ariya/index.html
          grep -q 'casearia-catalog' detektivnye-igry-dlya-dvoih/index.html
          grep -q 'href="2317/"' detektivnye-igry-dlya-dvoih/index.html
          grep -q 'href="407/"' detektivnye-igry-dlya-dvoih/index.html
          grep -q 'href="poslednyaya-ariya/"' detektivnye-igry-dlya-dvoih/index.html
          grep -q 'Купить дело — 299 ₽' detektivnye-igry-dlya-dvoih/index.html
          grep -q 'второй игрок бесплатно' detektivnye-igry-dlya-dvoih/index.html
          ! grep -q 'poslednyaya-ariya' sitemap.xml
          grep -q '"totalCases": 100' assets/generated/import-report.json
          grep -q '"freeCases": 15' assets/generated/import-report.json
          grep -q '"premiumCases": 85' assets/generated/import-report.json
          grep -q '"volume1Cases": 85' assets/generated/import-report.json
          grep -q '"volume2Cases": 0' assets/generated/import-report.json
          grep -Fq '<title>Детективные игры онлайн — 15 бесплатных дел</title>' index.html
          grep -q '15 бесплат' index.html
          grep -q '85' tom-1/index.html
          grep -q '199 ₽' tom-1/index.html

      - name: Browser smoke both roles, final and reveal
        working-directory: web
        run: node tools/last-aria-browser-smoke.mjs
      - name: Upload Last Aria screenshots
        uses: actions/upload-artifact@v4
        with:
          name: last-aria-browser-smoke
          path: web/artifacts/last-aria-browser/
          retention-days: 14
          if-no-files-found: error
