name: Validate Mystery Logic global stats

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-stats-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check ktovret-game/assets/app.js
          node --check ktovret-game/assets/global-stats-client.js
      - name: Validate global stats contract
        run: node tests/global-stats-contract.test.js
