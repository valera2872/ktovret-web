name: Zero Copy Editorial Audit
on:
  workflow_dispatch:
  push:
    branches: [feature/zero-copy-runtime-final]
    paths: ['.github/workflows/zero-copy-editorial-audit.yml']
jobs:
  audit-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Dump player-visible copy from isolated QA room
        shell: bash
        run: |
          cat > /tmp/audit.mjs <<'EOF'
          import crypto from 'node:crypto';
          const BASE='https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/';
          const ROOM=BASE+'zero-copy-room-v1';
          const key=()=>crypto.randomBytes(24).toString('hex');
          async function call(body,k){
            const r=await fetch(ROOM,{method:'POST',headers:{'content-type':'application/json','origin':'http://tftanyaf.beget.tech'},body:JSON.stringify({...body,browserKey:k})});
            const j=await r.json(); if(!r.ok) throw new Error(JSON.stringify(j)); return j;
          }
          const a=key(),b=key();
          const c=await call({action:'demo_create',playerName:'Editorial Investigator',guestKey:b,guestName:'Editorial Archivist'},a);
          const code=c.room.code;
          const inv=['scene','medical','fund','phone','passes','cards','terminal','access_hist','market','ratnikov_money','intermediary','denis_chat','denis_money','markin_draft','sofia'];
          const arc=['catalog','repair','cond19','change_dates','treatment','page31','photosession','capture1','capture2','outgoing','seal','box_exam','page12','anna_method','family_index'];
          for (const [role,k,ids] of [['investigator',a,inv],['archivist',b,arc]]){
            console.log('\n===== ROLE '+role+' =====');
            for(const id of ids){
              try{
                const z=await call({action:'open',code,id},k);
                const m=z.material||{};
                console.log('\n--- '+id+' ---');
                console.log('TITLE: '+(m.title||''));
                console.log('KIND: '+(m.kind||''));
                console.log('TEXT:\n'+(m.text||''));
              }catch(e){ console.log('\n--- '+id+' ERROR '+e.message); }
            }
          }
          EOF
          node /tmp/audit.mjs
