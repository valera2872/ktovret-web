name: TEMP AI-02 commerce resume smoke
on:
  push:
    branches:
      - feature/ai02-zero-copy-commerce-storefront-20261006
    paths:
      - '.github/workflows/temp-ai02-commerce-resume-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify permanent access and resume
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 2 --max-time 90 'https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai02-full-chain-qa-probe?run=commerce-resume-20261006')"
          echo "$body"
          BODY="$body" node -e 'const x=JSON.parse(process.env.BODY); if(x.pass!==true||x.before!==0||x.afterTurn!==1||x.afterReload!==1||x.remembered!==true||x.productId!=="ai02-zero-copy"){console.error(x);process.exit(1)}'
