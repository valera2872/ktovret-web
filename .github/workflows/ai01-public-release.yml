name: AI-01 closed public release

on:
  pull_request:
    paths:
      - 'detektivnaya-igra-s-ii/index.html'
      - 'assets/ai01-public-release.css'
      - 'assets/ai01-public-analytics.js'
      - 'assets/ai01-launch-promo.css'
      - 'assets/ai01-launch-promo.js'
      - 'assets/ai01-voice-input.css'
      - 'assets/ai01-voice-input.js'
      - 'supabase/functions/ai-voice-transcribe/**'
      - 'tools/import-mobile/logic-sitewide-postprocess.mjs'
      - 'tests/ai01-public-release-contract.mjs'
      - 'tests/ai01-voice-input-contract.mjs'
      - '.github/workflows/ai01-public-release.yml'
  push:
    branches: [main]
    paths:
      - 'detektivnaya-igra-s-ii/index.html'
      - 'assets/ai01-public-release.css'
      - 'assets/ai01-public-analytics.js'
      - 'assets/ai01-launch-promo.css'
      - 'assets/ai01-launch-promo.js'
      - 'assets/ai01-voice-input.css'
      - 'assets/ai01-voice-input.js'
      - 'supabase/functions/ai-voice-transcribe/**'
      - 'tools/import-mobile/logic-sitewide-postprocess.mjs'
      - 'tests/ai01-public-release-contract.mjs'
      - 'tests/ai01-voice-input-contract.mjs'
      - '.github/workflows/ai01-public-release.yml'

jobs:
  closed-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/ai01-launch-promo.js
      - run: node --check assets/ai01-public-analytics.js
      - run: node --check assets/ai01-voice-input.js
      - run: node --check tools/import-mobile/logic-sitewide-postprocess.mjs
      - run: node tests/ai01-public-release-contract.mjs
      - run: node tests/ai01-voice-input-contract.mjs
      - name: Speech transcription endpoint status
        env:
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJvcm9zIiwicmVmIjoib3JrbnZ1d2tudnZzZWRqZ2Nm d2MiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NjE5NjYzNywiZXhwIjoyMTAxNzcyNjM3fQ.INVALID
        run: |
          ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ya252dXdrbnZzZWRqZ3FjZndjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTY2MzcsImV4cCI6MjEwMTc3MjYzN30.68loNx8A71dodfOXXKs_-I235XVCmEioXGrg8kCZQr4'
          curl --fail --silent --show-error -D /tmp/voice-headers.txt -o /tmp/voice-status.json \
            'https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai-voice-transcribe' \
            -H 'Origin: https://valera2872.github.io' \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"action":"status"}'
          tr -d '\r' < /tmp/voice-headers.txt | grep -Fiq 'access-control-allow-origin: https://valera2872.github.io'
          jq -e '.ready == true and .model == "gpt-4o-mini-transcribe" and .max_duration_ms == 30000' /tmp/voice-status.json
