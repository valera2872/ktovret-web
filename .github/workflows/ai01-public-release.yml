name: AI-01 public Text release

on:
  pull_request:
    paths:
      - 'detektivnaya-igra-s-ii/index.html'
      - 'assets/ai01-public-release.css'
      - 'assets/ai01-public-analytics.js'
      - 'assets/ai01-launch-promo.css'
      - 'assets/ai01-launch-promo.js'
      - 'assets/ai01-static-portraits.css'
      - 'assets/ai01-static-portraits.js'
      - 'assets/ai01-suspects-strip.b64.txt'
      - 'assets/ai01-voice-input.css'
      - 'assets/ai01-voice-input.js'
      - 'supabase/functions/ai-voice-transcribe/**'
      - 'tools/import-mobile/logic-sitewide-postprocess.mjs'
      - 'tests/ai01-public-release-contract.mjs'
      - 'tests/ai01-static-portraits-contract.mjs'
      - 'tests/ai01-sitewide-launch-contract.mjs'
      - 'tests/ai01-voice-input-contract.mjs'
      - '.github/workflows/ai01-public-release.yml'
  push:
    branches: [main]
    paths:
      - 'detektivnaya-igra-s-ii/index.html'
      - 'assets/ai01-public-release.css'
      - 'assets/ai01-public-analytics.js'
      - 'assets/ai01-launch-promo.css'
      - 'assets/ai01-launch-promo.js'
      - 'assets/ai01-static-portraits.css'
      - 'assets/ai01-static-portraits.js'
      - 'assets/ai01-suspects-strip.b64.txt'
      - 'assets/ai01-voice-input.css'
      - 'assets/ai01-voice-input.js'
      - 'supabase/functions/ai-voice-transcribe/**'
      - 'tools/import-mobile/logic-sitewide-postprocess.mjs'
      - 'tests/ai01-public-release-contract.mjs'
      - 'tests/ai01-static-portraits-contract.mjs'
      - 'tests/ai01-sitewide-launch-contract.mjs'
      - 'tests/ai01-voice-input-contract.mjs'
      - '.github/workflows/ai01-public-release.yml'

jobs:
  public-text-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/ai01-launch-promo.js
      - run: node --check assets/ai01-public-analytics.js
      - run: node --check assets/ai01-static-portraits.js
      - run: node --check assets/ai01-voice-input.js
      - run: node --check tools/import-mobile/logic-sitewide-postprocess.mjs
      - run: node tests/ai01-public-release-contract.mjs
      - run: node tests/ai01-static-portraits-contract.mjs
      - run: node tests/ai01-sitewide-launch-contract.mjs
      - run: node tests/ai01-voice-input-contract.mjs
