name: Zero Copy Beget CORS
on:
  push:
    branches: [feature/zero-copy-runtime-final]
    paths:
      - 'qa-zero-copy/beget-cors.mjs'
      - '.github/workflows/zero-copy-beget-cors.yml'
  workflow_dispatch:
jobs:
  cors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa-zero-copy/beget-cors.mjs
