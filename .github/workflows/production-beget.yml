name: Build Mystery Logic production bundle for Beget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-beget.yml'
      - 'assets/**'
      - 'tools/**'
      - 'index.html'
      - 'dela/**'
      - 'tom-1/**'
      - 'detektivnye-igry-dlya-odnogo/**'
      - 'logicheskie-zadachi/**'
      - 'golovolomki-onlayn/**'
      - 'zagadki-na-logiku-dlya-vzroslyh/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  KTOVRET_SOURCE_COMMIT: a2ad0f80e70beeb91d478f0bcf98d0ea31cc05dd
  KTOVRET_SOURCE_TOKEN: ${{ secrets.KTOVRET_SOURCE_TOKEN }}
  MYSTERYLOGIC_SITE_ORIGIN: https://mysterylogic.com/

jobs:
  production-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Require private source token
        run: |
          test -n "$KTOVRET_SOURCE_TOKEN" || (echo "Repository secret KTOVRET_SOURCE_TOKEN is required to read private valera2872/ktovret" && exit 1)

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: web

      - name: Checkout private mobile content
        uses: actions/checkout@v4
        with:
          repository: valera2872/ktovret
          ref: ${{ env.KTOVRET_SOURCE_COMMIT }}
          path: mobile-source
          persist-credentials: false
          token: ${{ env.KTOVRET_SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate production public library
        working-directory: web
        run: node tools/import-mobile-cases.mjs --source ../mobile-source --site . --mode public --commit "$KTOVRET_SOURCE_COMMIT"

      - name: Enable production storefront checkout
        working-directory: web
        run: node tools/enable-volume-checkout.mjs --site .

      - name: Validate generated public boundary
        working-directory: web
        run: |
          test "$(find delo -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 100
          test "$(grep -rl 'window.KtoVretWeb=' delo/*/index.html | wc -l)" -eq 15
          test "$(grep -rlE 'Материалы(, показания)? и решение не загружаются' delo/*/index.html | wc -l)" -eq 85
          test "$(find ru/cases -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 100
          test "$(grep -rl 'data-seo-prerender' ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'data-premium-seo-teaser' ru/cases/*/index.html | wc -l)" -eq 85
          test "$(grep -l 'data-premium-seo-teaser' ru/cases/*/index.html | xargs grep -l 'window.KtoVretWeb=' | wc -l)" -eq 0
          test "$(grep -rl 'name=\"robots\" content=\"noindex' ru/cases/*/index.html | wc -l)" -eq 0
          test -f ru/besplatnye-detektivnye-dela/index.html
          test -f golovolomki-onlayn/index.html
          test -f zagadki-na-logiku-dlya-vzroslyh/index.html
          test -f detektivnye-igry-dlya-dvoih/index.html
          test -f detektivnye-igry-dlya-odnogo/index.html
          test -f detektivnye-igry-dlya-odnogo/407/index.html
          grep -q '<meta name="robots" content="noindex,follow">' detektivnye-igry-dlya-odnogo/407/index.html
          test -f tom-1/index.html
          grep -q 'Открыть 85 дел за 99 ₽' tom-1/index.html
          grep -q 'data-volume-email' tom-1/index.html
          grep -q 'data-volume-offer-accept' tom-1/index.html
          grep -q 'data-volume-privacy-ack' tom-1/index.html
          grep -q 'volume-storefront.js?v=' tom-1/index.html
          grep -q '<link rel="canonical" href="https://mysterylogic.com/tom-1/">' tom-1/index.html
          ! grep -q 'name="robots" content="noindex' tom-1/index.html
          test "$(grep -o 'data-access=\"premium\"' dela/index.html | wc -l)" -eq 0
          test "$(grep -o 'class=\"case-card\"' dela/index.html | wc -l)" -eq 15
          grep -q 'Архивы первого тома' dela/index.html

          # Puzzle vertical: 3 SEO hubs + 20 indexable Expert tasks.
          test -f assets/logic-hub.css
          test -f assets/logic-expert-seo.css
          test -f assets/logic-expert.js
          test -f logicheskie-zadachi/index.html
          test "$(find logicheskie-zadachi -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 20
          test -f logicheskie-zadachi/protokol-shesti-cifr/index.html
          test -f logicheskie-zadachi/domino-razbienie-4x5/index.html
          test ! -d logicheskie-zadachi/shest-pokazaniy
          test ! -d logicheskie-zadachi/arhivnaya-matrica-5x5
          grep -q 'data-logic-home-launch' index.html
          grep -q '>Головоломки</a>' index.html
          grep -q 'Сложные головоломки онлайн для взрослых' golovolomki-onlayn/index.html
          grep -q 'Загадки на логику для взрослых с ответами' zagadki-na-logiku-dlya-vzroslyh/index.html
          grep -q 'Сложные логические задачи уровня Expert' logicheskie-zadachi/index.html
          test "$(grep -o 'data-expert-card=' logicheskie-zadachi/index.html | wc -l)" -eq 20
          grep -q 'data-expert-puzzle="expert:001"' logicheskie-zadachi/protokol-shesti-cifr/index.html
          grep -q 'https://t.me/mysterylogic' logicheskie-zadachi/index.html
          grep -q '"indexableUrls": 133' assets/generated/import-report.json
          grep -q '"logicHubPuzzles": 20' assets/generated/import-report.json
          grep -q '"logicHubPages": 23' assets/generated/import-report.json
          grep -q '"logicHubVersion": "2.0.0"' assets/generated/import-report.json
          grep -q '"logicExpertMainHub": "golovolomki-onlayn/"' assets/generated/import-report.json
          grep -q '"logicExpertAdultHub": "zagadki-na-logiku-dlya-vzroslyh/"' assets/generated/import-report.json
          grep -q '"seoCasePages": 100' assets/generated/import-report.json
          grep -q '"premiumSeoTeaserPages": 85' assets/generated/import-report.json
          grep -q '"wordstatHubPages": 3' assets/generated/import-report.json
          grep -q '"soloHubPage": "detektivnye-igry-dlya-odnogo"' assets/generated/import-report.json
          grep -q '"soloCaseRoute": "detektivnye-igry-dlya-odnogo/407"' assets/generated/import-report.json
          grep -q '"soloMaterials": 18' assets/generated/import-report.json
          grep -q '"storefrontReferenceV41Pages": 3' assets/generated/import-report.json
          grep -q '"storefrontReferenceV41Version": "4.1.4"' assets/generated/import-report.json
          grep -q 'storefront-reference-v41.css' index.html
          grep -q 'storefront-reference-v41.css' dela/index.html
          grep -q 'storefront-reference-v41.css' tom-1/index.html
          grep -q 'data-reference-asset="home-hero"' index.html
          grep -q 'data-reference-asset="home-lower"' index.html
          grep -q 'data-reference-asset="archive-hero"' tom-1/index.html
          grep -q 'data-reference-asset="archive-grid"' tom-1/index.html
          grep -q 'solo407-home-switch' index.html
          grep -q 'solo407-format-switch' detektivnye-igry-dlya-dvoih/index.html
          echo '8b9dd47a1d3e5527ef42aba87dc78be62b7da392c196e62d774758b076971a02  assets/reference-home-hero.webp' | sha256sum -c -
          echo '7d247ec7a20dd66ff43f86f98575554884f4788ee59d3f26d944e68a81c7821f  assets/reference-archive-hero.webp' | sha256sum -c -
          echo '3b19ea14f7a56bd0468a36eae333642fa3509335778163e464b611e2d27cf42b  assets/reference-archive-grid.webp' | sha256sum -c -
          echo '7068a5cc516fd4f80205464831e2caf1ba6487babd0bedd896f4eba7e83c92cf  assets/reference-home-lower.webp' | sha256sum -c -
          test "$(grep -c '<url>' sitemap.xml)" -eq 133
          grep -q '<loc>https://mysterylogic.com/tom-1/</loc>' sitemap.xml
          grep -q '<loc>https://mysterylogic.com/ru/besplatnye-detektivnye-dela/</loc>' sitemap.xml
          grep -q '<loc>https://mysterylogic.com/golovolomki-onlayn/</loc>' sitemap.xml
          grep -q '<loc>https://mysterylogic.com/zagadki-na-logiku-dlya-vzroslyh/</loc>' sitemap.xml
          grep -q '<loc>https://mysterylogic.com/detektivnye-igry-dlya-dvoih/</loc>' sitemap.xml
          grep -q '<loc>https://mysterylogic.com/detektivnye-igry-dlya-odnogo/</loc>' sitemap.xml
          grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/</loc>' sitemap.xml
          grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/protokol-shesti-cifr/</loc>' sitemap.xml
          grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/domino-razbienie-4x5/</loc>' sitemap.xml
          test "$(grep -o 'https://mysterylogic.com/logicheskie-zadachi/[^<]*/' sitemap.xml | wc -l)" -eq 20
          ! grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/shest-pokazaniy/</loc>' sitemap.xml
          ! grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/arhivnaya-matrica-5x5/</loc>' sitemap.xml
          ! grep -q '<loc>https://mysterylogic.com/detektivnye-igry-dlya-odnogo/407/</loc>' sitemap.xml
          grep -q 'Sitemap: https://mysterylogic.com/sitemap.xml' robots.txt
          ! grep -R -n --include='*.html' --include='*.xml' --include='*.txt' --include='*.json' 'https://valera2872.github.io/ktovret-web/' . \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=tools --exclude-dir=tests --exclude-dir=supabase --exclude-dir=artifacts
          grep -q "checkoutEnabled:true" assets/paid-access-config.js
          node --check assets/volume-storefront.js
          node --check assets/case-407-solo.js
          node --check assets/logic-expert.js
          node --check tools/import-mobile/logic-expert-release-data.mjs
          node --check tools/import-mobile/logic-expert-seo-postprocess.mjs
          node --check tools/logic-expert-review-v2-validate.mjs
          node --check tools/logic-expert-review-v2-extension-validate.mjs
          node --check tools/enable-volume-checkout.mjs
          node --check tools/archive-visual-smoke.mjs
          node tools/logic-expert-review-v2-validate.mjs
          node tools/logic-expert-review-v2-extension-validate.mjs

      - name: Render approved production storefront smoke
        working-directory: web
        run: node tools/archive-visual-smoke.mjs

      - name: Prepare Beget runtime tree
        run: |
          cp -a web production-web
          rm -rf \
            production-web/.git \
            production-web/.github \
            production-web/tools \
            production-web/tests \
            production-web/artifacts \
            production-web/supabase \
            production-web/node_modules \
            production-web/docs \
            production-web/ops \
            production-web/old.bac
          rm -f \
            production-web/.gitignore \
            production-web/preview-all-100.cmd \
            production-web/README.md \
            production-web/PROJECT_CHECKPOINT.md \
            production-web/package.json \
            production-web/package-lock.json \
            production-web/site-origin.json \
            production-web/release-web-mvp-0.1.0.txt
          cat > production-web/.htaccess <<'HTACCESS'
          Options -Indexes
          DirectoryIndex index.html index.php

          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{HTTPS} !=on [OR]
            RewriteCond %{HTTP_HOST} !^mysterylogic\.com$ [NC]
            RewriteRule ^ https://mysterylogic.com%{REQUEST_URI} [L,R=301]
          </IfModule>

          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>
          HTACCESS

      - name: Stamp production asset cache keys
        run: |
          release_version="${GITHUB_SHA::12}"
          while IFS= read -r -d '' file; do
            sed -i -E "s/\\?v=[0-9A-Za-z._-]+/?v=${release_version}/g" "$file"
          done < <(find production-web -type f -name '*.html' -print0)
          grep -R -q "app.js?v=${release_version}" production-web/ru/cases
          grep -q "challenge-page.js?v=${release_version}" production-web/challenge/index.html
          grep -q "volume-storefront.css?v=${release_version}" production-web/tom-1/index.html
          grep -q "volume-storefront.js?v=${release_version}" production-web/tom-1/index.html
          grep -q "storefront-reference-v41.css?v=${release_version}" production-web/index.html
          grep -q "storefront-reference-v41.css?v=${release_version}" production-web/dela/index.html
          grep -q "storefront-reference-v41.css?v=${release_version}" production-web/tom-1/index.html
          grep -q "case-407-solo.css?v=${release_version}" production-web/detektivnye-igry-dlya-odnogo/index.html
          grep -q "case-407-solo.js?v=${release_version}" production-web/detektivnye-igry-dlya-odnogo/407/index.html
          grep -q "logic-hub.css?v=${release_version}" production-web/logicheskie-zadachi/index.html
          grep -q "logic-expert-seo.css?v=${release_version}" production-web/logicheskie-zadachi/index.html
          grep -q "logic-expert.js?v=${release_version}" production-web/logicheskie-zadachi/index.html
          grep -q "logic-expert.js?v=${release_version}" production-web/golovolomki-onlayn/index.html

      - name: Validate Beget runtime tree
        run: |
          test -f production-web/index.html
          test -f production-web/.htaccess
          test -f production-web/sitemap.xml
          test -f production-web/robots.txt
          test -f production-web/assets/paid-access-client.js
          test -f production-web/assets/volume-storefront.js
          test -f production-web/assets/mobile-scroll-stabilizer.js
          test -f production-web/assets/challenge-page.js
          test -f production-web/assets/challenge.css
          test -f production-web/assets/volume-storefront.css
          test -f production-web/assets/storefront-reference-v41.css
          test -f production-web/assets/case-407-solo.css
          test -f production-web/assets/case-407-solo.js
          test -f production-web/assets/logic-hub.css
          test -f production-web/assets/logic-expert-seo.css
          test -f production-web/assets/logic-expert.js
          test -f production-web/assets/reference-home-hero.webp
          test -f production-web/assets/reference-home-lower.webp
          test -f production-web/assets/reference-archive-hero.webp
          test -f production-web/assets/reference-archive-grid.webp
          test -f production-web/challenge/index.html
          test -f production-web/tom-1/index.html
          test -f production-web/golovolomki-onlayn/index.html
          test -f production-web/zagadki-na-logiku-dlya-vzroslyh/index.html
          test -f production-web/detektivnye-igry-dlya-dvoih/index.html
          test -f production-web/detektivnye-igry-dlya-odnogo/index.html
          test -f production-web/detektivnye-igry-dlya-odnogo/407/index.html
          test -f production-web/logicheskie-zadachi/index.html
          test "$(find production-web/logicheskie-zadachi -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 20
          test -f production-web/logicheskie-zadachi/protokol-shesti-cifr/index.html
          test -f production-web/logicheskie-zadachi/domino-razbienie-4x5/index.html
          test ! -d production-web/logicheskie-zadachi/shest-pokazaniy
          test ! -d production-web/logicheskie-zadachi/arhivnaya-matrica-5x5
          test -f production-web/ktovret-game/assets/app-core.js
          test -f production-web/ktovret-game/assets/challenge-client.js
          grep -q 'data-volume-email' production-web/tom-1/index.html
          grep -q 'data-volume-offer-accept' production-web/tom-1/index.html
          grep -q 'data-volume-privacy-ack' production-web/tom-1/index.html
          grep -q 'volume-storefront.js?v=' production-web/tom-1/index.html
          grep -q 'data-reference-asset="home-hero"' production-web/index.html
          grep -q 'data-reference-asset="home-lower"' production-web/index.html
          grep -q 'data-reference-asset="archive-hero"' production-web/tom-1/index.html
          grep -q 'data-reference-asset="archive-grid"' production-web/tom-1/index.html
          grep -q 'data-logic-home-launch' production-web/index.html
          grep -q '>Головоломки</a>' production-web/index.html
          grep -q 'data-expert-puzzle="expert:001"' production-web/logicheskie-zadachi/protokol-shesti-cifr/index.html
          grep -q 'https://t.me/mysterylogic' production-web/logicheskie-zadachi/index.html
          grep -q 'support@mysterylogic.com' production-web/tom-1/index.html
          grep -q 'Политика конфиденциальности' production-web/tom-1/index.html
          grep -q '<link rel="canonical" href="https://mysterylogic.com/tom-1/">' production-web/tom-1/index.html
          grep -q '<link rel="canonical" href="https://mysterylogic.com/golovolomki-onlayn/">' production-web/golovolomki-onlayn/index.html
          grep -q '<link rel="canonical" href="https://mysterylogic.com/zagadki-na-logiku-dlya-vzroslyh/">' production-web/zagadki-na-logiku-dlya-vzroslyh/index.html
          grep -q '<link rel="canonical" href="https://mysterylogic.com/logicheskie-zadachi/">' production-web/logicheskie-zadachi/index.html
          ! grep -q 'name="robots" content="noindex' production-web/tom-1/index.html
          grep -q '<meta name="robots" content="noindex,follow">' production-web/detektivnye-igry-dlya-odnogo/407/index.html
          echo '8b9dd47a1d3e5527ef42aba87dc78be62b7da392c196e62d774758b076971a02  production-web/assets/reference-home-hero.webp' | sha256sum -c -
          echo '7d247ec7a20dd66ff43f86f98575554884f4788ee59d3f26d944e68a81c7821f  production-web/assets/reference-archive-hero.webp' | sha256sum -c -
          echo '3b19ea14f7a56bd0468a36eae333642fa3509335778163e464b611e2d27cf42b  production-web/assets/reference-archive-grid.webp' | sha256sum -c -
          echo '7068a5cc516fd4f80205464831e2caf1ba6487babd0bedd896f4eba7e83c92cf  production-web/assets/reference-home-lower.webp' | sha256sum -c -
          test ! -d production-web/supabase
          test ! -d production-web/tools
          test ! -d production-web/tests
          test ! -d production-web/docs
          test ! -d production-web/ops
          test ! -d production-web/old.bac
          test ! -f production-web/.gitignore
          test ! -f production-web/release-web-mvp-0.1.0.txt
          test "$(find production-web/ru/cases -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 100
          test "$(grep -rl 'data-seo-prerender' production-web/ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'data-premium-seo-teaser' production-web/ru/cases/*/index.html | wc -l)" -eq 85
          test "$(grep -rl 'noindex,follow' production-web/delo/*/index.html | wc -l)" -eq 100
          test "$(grep -c '<url>' production-web/sitemap.xml)" -eq 133
          grep -q '<loc>https://mysterylogic.com/tom-1/</loc>' production-web/sitemap.xml
          grep -q '<loc>https://mysterylogic.com/golovolomki-onlayn/</loc>' production-web/sitemap.xml
          grep -q '<loc>https://mysterylogic.com/zagadki-na-logiku-dlya-vzroslyh/</loc>' production-web/sitemap.xml
          grep -q '<loc>https://mysterylogic.com/detektivnye-igry-dlya-dvoih/</loc>' production-web/sitemap.xml
          grep -q '<loc>https://mysterylogic.com/detektivnye-igry-dlya-odnogo/</loc>' production-web/sitemap.xml
          grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/</loc>' production-web/sitemap.xml
          grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/protokol-shesti-cifr/</loc>' production-web/sitemap.xml
          grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/domino-razbienie-4x5/</loc>' production-web/sitemap.xml
          test "$(grep -o 'https://mysterylogic.com/logicheskie-zadachi/[^<]*/' production-web/sitemap.xml | wc -l)" -eq 20
          ! grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/shest-pokazaniy/</loc>' production-web/sitemap.xml
          ! grep -q '<loc>https://mysterylogic.com/logicheskie-zadachi/arhivnaya-matrica-5x5/</loc>' production-web/sitemap.xml
          ! grep -q '<loc>https://mysterylogic.com/detektivnye-igry-dlya-odnogo/407/</loc>' production-web/sitemap.xml
          ! grep -R -n --include='*.html' --include='*.xml' --include='*.txt' --include='*.json' 'https://valera2872.github.io/ktovret-web/' production-web

      - name: Create ZIP
        run: |
          cd production-web
          zip -qr ../mysterylogic-beget-production.zip .
          cd ..
          unzip -l mysterylogic-beget-production.zip | sed -n '1,100p'

      - name: Upload production storefront smoke
        uses: actions/upload-artifact@v4
        with:
          name: mysterylogic-production-storefront-smoke
          path: web/artifacts/storefront-reference-smoke
          retention-days: 14
          if-no-files-found: error

      - name: Upload Beget production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mysterylogic-beget-production
          path: mysterylogic-beget-production.zip
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
