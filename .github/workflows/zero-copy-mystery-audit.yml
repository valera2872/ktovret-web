name: Zero Copy Mystery Audit
on:
  push:
    branches: [feature/zero-copy-runtime-final]
    paths:
      - 'qa-zero-copy/mystery-audit.mjs'
      - '.github/workflows/zero-copy-mystery-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa-zero-copy/mystery-audit.mjs
