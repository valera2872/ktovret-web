name: Validate Solo mini investigations

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/solo-mini.css'
      - 'assets/solo-mini.js'
      - 'assets/solo-mini-cases.js'
      - 'tools/solo-mini-validate.mjs'
      - 'tools/import-mobile/solo-mini-postprocess.mjs'
      - 'tools/import-mobile/solo-hub-kto-vret-polish.mjs'
      - '.github/workflows/solo-mini.yml'
  push:
    branches: [main]
    paths:
      - 'assets/solo-mini.css'
      - 'assets/solo-mini.js'
      - 'assets/solo-mini-cases.js'
      - 'tools/solo-mini-validate.mjs'
      - 'tools/import-mobile/solo-mini-postprocess.mjs'
      - 'tools/import-mobile/solo-hub-kto-vret-polish.mjs'
      - '.github/workflows/solo-mini.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check assets/solo-mini.js
          node --check assets/solo-mini-cases.js
          node --check tools/import-mobile/solo-mini-postprocess.mjs
          node --check tools/solo-mini-validate.mjs
      - name: Content and route contract
        run: node tools/solo-mini-validate.mjs
