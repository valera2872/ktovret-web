name: Validate AI-02 investigator workspace

on:
  pull_request:
    paths:
      - 'staging-previews/ai02/**'
      - 'assets/ai02-investigator-workspace.js'
      - 'assets/ai02-premium.css'
      - 'tests/ai02-investigator-workspace-contract.mjs'
      - 'tests/ai02-production-commerce-contract.mjs'
      - 'assets/ai-case-player-v2.js'
      - 'assets/ai02-storefront.js'
      - 'assets/ai02-storefront.css'
      - 'assets/ai-investigations-catalog.css'
      - 'detektivnaya-igra-s-ii/nulevaya-kopiya/**'
      - '.github/workflows/ai02-investigator-workspace.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check assets/ai02-investigator-workspace.js
          node --check assets/ai-case-player-v2.js
          node --check assets/ai02-storefront.js
      - name: Contract
        run: |
          node tests/ai02-investigator-workspace-contract.mjs
          node tests/ai02-production-commerce-contract.mjs
