name: Align paid storefront ownership test

on:
  push:
    branches:
      - feat/two-player-rooms

permissions:
  contents: write

jobs:
  align_paid_module_test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/two-player-rooms
          fetch-depth: 0

      - name: Assert checkout token logic in the storefront module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/paid-access-boundary.test.js')
          text = path.read_text(encoding='utf-8')
          anchor = "const client=fs.readFileSync(path.join(root,'assets/paid-access-client.js'),'utf8');\n"
          addition = anchor + "const storefront=fs.readFileSync(path.join(root,'assets/volume-storefront.js'),'utf8');\n"
          if "const storefront=fs.readFileSync" not in text:
              if anchor not in text:
                  raise SystemExit('paid client import anchor not found')
              text = text.replace(anchor, addition, 1)
          for needle in [
              "crypto.getRandomValues(bytes)",
              "localStorage.setItem(storageKey, token)",
              "track('purchase_completed'",
              "payment_return",
          ]:
              old = f"client.includes({needle!r})"
              # JS source uses single-quoted argument in the generated assertion;
              # replace by the identifier only to preserve existing quoting.
          text = text.replace("client.includes('crypto.getRandomValues(bytes)')", "storefront.includes('crypto.getRandomValues(bytes)')")
          text = text.replace("client.includes('localStorage.setItem(storageKey, token)')", "storefront.includes('localStorage.setItem(storageKey, token)')")
          text = text.replace("client.includes(\"track('purchase_completed'\")", "storefront.includes(\"track('purchase_completed'\")")
          text = text.replace("client.includes('payment_return')", "storefront.includes('payment_return')")
          path.write_text(text, encoding='utf-8')
          PY
          grep -q "const storefront=fs.readFileSync(path.join(root,'assets/volume-storefront.js'),'utf8');" tests/paid-access-boundary.test.js
          grep -q "storefront.includes('crypto.getRandomValues(bytes)')" tests/paid-access-boundary.test.js
          grep -q "storefront.includes('localStorage.setItem(storageKey, token)')" tests/paid-access-boundary.test.js
          grep -q "storefront.includes(\"track('purchase_completed'\")" tests/paid-access-boundary.test.js
          grep -q "storefront.includes('payment_return')" tests/paid-access-boundary.test.js

      - name: Commit alignment and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-paid-access-module-test.yml
          git add tests/paid-access-boundary.test.js
          git diff --cached --check
          git commit -m 'test: assert checkout token flow on volume storefront'
          git push origin HEAD:feat/two-player-rooms
