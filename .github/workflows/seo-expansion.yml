name: Validate Mystery Logic SEO expansion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KTOVRET_SOURCE_COMMIT: a2ad0f80e70beeb91d478f0bcf98d0ea31cc05dd
  KTOVRET_SOURCE_TOKEN: ${{ secrets.KTOVRET_SOURCE_TOKEN }}

jobs:
  seo-expansion:
    runs-on: ubuntu-latest
    steps:
      - name: Require private source token
        run: test -n "$KTOVRET_SOURCE_TOKEN" || (echo "KTOVRET_SOURCE_TOKEN is required" && exit 1)

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          path: web

      - name: Checkout private mobile content
        uses: actions/checkout@v4
        with:
          repository: valera2872/ktovret
          ref: ${{ env.KTOVRET_SOURCE_COMMIT }}
          path: mobile-source
          persist-credentials: false
          token: ${{ env.KTOVRET_SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate public SEO library
        working-directory: web
        run: node tools/import-mobile-cases.mjs --source ../mobile-source --site . --mode public --commit "$KTOVRET_SOURCE_COMMIT"

      - name: Validate generator syntax and SEO contract
        working-directory: web
        run: |
          node --check tools/import-mobile/seo-wordstat-expansion.mjs
          node --check tools/import-mobile/load-active.mjs
          node --check tools/import-mobile/two-player-room-postprocess.mjs
          node --check tools/import-mobile-cases.mjs
          node --check assets/duel-room.js
          node --check ktovret-game/assets/duel-room-client.js
          node tests/seo-native-cases.test.js

      - name: Validate spoiler-safe 112 URL boundary
        working-directory: web
        run: |
          test "$(find ru/cases -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 100
          test "$(grep -rl 'data-seo-prerender' ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'data-premium-seo-teaser' ru/cases/*/index.html | wc -l)" -eq 85
          test "$(grep -l 'data-premium-seo-teaser' ru/cases/*/index.html | xargs grep -l 'window.KtoVretWeb=' | wc -l)" -eq 0
          test "$(grep -l 'data-premium-seo-teaser' ru/cases/*/index.html | xargs grep -l 'data-seo-statements' | wc -l)" -eq 0
          test "$(grep -l 'data-premium-seo-teaser' ru/cases/*/index.html | xargs grep -l 'correctOption' | wc -l)" -eq 0
          test "$(grep -rl 'name=\"robots\" content=\"noindex' ru/cases/*/index.html | wc -l)" -eq 0
          test "$(grep -rl 'noindex,follow' delo/*/index.html | wc -l)" -eq 100
          test "$(grep -c '<url>' sitemap.xml)" -eq 112
          grep -q '"indexableUrls": 112' assets/generated/import-report.json
          grep -q '"seoCasePages": 100' assets/generated/import-report.json
          grep -q '"premiumSeoTeaserPages": 85' assets/generated/import-report.json
          grep -q '"wordstatHubPages": 3' assets/generated/import-report.json
          grep -q '"twoPlayerRoomPage": "detektivnye-igry-dlya-dvoih"' assets/generated/import-report.json
          grep -q '"twoPlayerRoomFreeCases": 15' assets/generated/import-report.json
          grep -q '"sourceCommit": "a2ad0f80e70beeb91d478f0bcf98d0ea31cc05dd"' assets/generated/import-report.json
          grep -R -q 'Павел ошибается: в 18:10 он пользовался не личной картой, а ключом' ru/cases/*/index.html
          grep -q 'Все необходимые сведения есть в материалах дела' index.html
          grep -q 'Определить правильную последовательность' index.html
          test -f golovolomki-onlayn/index.html
          test -f zagadki-na-logiku-dlya-vzroslyh/index.html
          test -f detektivnye-igry-dlya-dvoih/index.html

      - name: Validate two-player room UX boundary
        working-directory: web
        run: |
          grep -q '<title>Детективная игра для двоих онлайн</title>' detektivnye-igry-dlya-dvoih/index.html
          grep -q '<h1>Детективная игра для двоих онлайн</h1>' detektivnye-igry-dlya-dvoih/index.html
          grep -q 'data-duel-room-app' detektivnye-igry-dlya-dvoih/index.html
          grep -q 'Создайте комнату' detektivnye-igry-dlya-dvoih/index.html
          grep -q 'Ответы друг друга скрыты до финала' detektivnye-igry-dlya-dvoih/index.html
          test "$(grep -rl 'data-duel-storage-isolation' ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'duel-room-client.js' ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'duel-room-client.js' ru/cases/*/index.html | xargs grep -l 'data-premium-seo-teaser' | wc -l)" -eq 0

      - name: Upload generated SEO sample
        uses: actions/upload-artifact@v4
        with:
          name: mysterylogic-seo-expansion-sample
          path: |
            web/assets/generated/import-report.json
            web/sitemap.xml
            web/index.html
            web/detektivnye-igry-onlayn/index.html
            web/golovolomki-onlayn/index.html
            web/zagadki-na-logiku-dlya-vzroslyh/index.html
            web/detektivnye-igry-dlya-dvoih/index.html
            web/ru/cases
          retention-days: 7
