name: Validate advanced investigations

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/investigations/**"
      - "ru/investigations/**"
      - "tests/investigation-core.test.js"
      - "tests/debrief-panel.test.js"
      - "tests/case-intro.test.js"
      - "tools/investigation-smoke.mjs"
      - ".github/workflows/advanced-investigation.yml"
  push:
    branches: [main]
    paths:
      - "assets/investigations/**"
      - "ru/investigations/**"
      - "tests/investigation-core.test.js"
      - "tests/debrief-panel.test.js"
      - "tests/case-intro.test.js"
      - "tools/investigation-smoke.mjs"
      - ".github/workflows/advanced-investigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check assets/investigations/investigation-core.js
          node --check assets/investigations/last-build.ru.js
          node --check assets/investigations/last-build-human-layer.js
          node --check assets/investigations/last-build-presentation.js
          node --check assets/investigations/last-build-evidence.js
          node --check assets/investigations/last-build-timeline.js
          node --check assets/investigations/last-build-questions.js
          node --check assets/investigations/last-build-debrief.js
          node --check assets/investigations/last-build-intro.js
          node --check assets/investigations/result-preview.js
          node --check assets/investigations/investigation-app.js
          node --check assets/investigations/preview-initial-view.js
          node --check assets/investigations/investigation-fairplay.js
          node --check assets/investigations/evidence-renderers.js
          node --check assets/investigations/evidence-preview.js
          node --check assets/investigations/statement-history.js
          node --check assets/investigations/timeline-panel.js
          node --check assets/investigations/questions-panel.js
          node --check assets/investigations/debrief-panel.js
          node --check assets/investigations/case-intro.js
          node --check tools/investigation-smoke.mjs
          node --check tests/debrief-panel.test.js
          node --check tests/case-intro.test.js
      - name: Validate Last Build graph and full playthrough
        run: |
          node tests/investigation-core.test.js
          node tests/debrief-panel.test.js
          node tests/case-intro.test.js
      - name: Render Last Build, premium evidence and final states in mobile and desktop Chrome
        run: node tools/investigation-smoke.mjs
      - name: Validate premium web layers and laboratory boundary
        run: |
          test -f ru/investigations/poslednyaya-sborka/index.html
          test -f assets/investigations/evidence.css
          test -f assets/investigations/statement-history.css
          test -f assets/investigations/timeline-panel.css
          test -f assets/investigations/questions-panel.css
          test -f assets/investigations/debrief-panel.css
          test -f assets/investigations/case-intro.css
          grep -q 'name="robots" content="noindex,follow"' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'data-ml-investigation' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'last-build-human-layer.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'last-build-presentation.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'last-build-evidence.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'last-build-timeline.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'last-build-questions.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'last-build-debrief.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'last-build-intro.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'result-preview.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'preview-initial-view.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'evidence-renderers.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'evidence-preview.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'statement-history.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'timeline-panel.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'questions-panel.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'debrief-panel.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'case-intro.js' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'evidence.css' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'statement-history.css' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'timeline-panel.css' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'questions-panel.css' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'debrief-panel.css' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'case-intro.css' ru/investigations/poslednyaya-sborka/index.html
          grep -q 'investigation-fairplay.js' ru/investigations/poslednyaya-sborka/index.html
          ! grep -q 'poslednyaya-sborka' sitemap.xml
          ! grep -q 'poslednyaya-sborka' dela/index.html
