name: AI detective vertical slice

on:
  pull_request:
    paths:
      - 'detektivnaya-igra-s-ii/**'
      - 'assets/ai-detective-vslice.*'
      - 'supabase/functions/ai-interrogation-v1/**'
      - 'tests/ai-detective-vslice-contract.mjs'
      - 'tools/ai-detective-visual-smoke.mjs'
      - '.github/workflows/ai-detective-vslice.yml'
  push:
    branches: [main]
    paths:
      - 'detektivnaya-igra-s-ii/**'
      - 'assets/ai-detective-vslice.*'
      - 'supabase/functions/ai-interrogation-v1/**'
      - 'tests/ai-detective-vslice-contract.mjs'
      - 'tools/ai-detective-visual-smoke.mjs'
      - '.github/workflows/ai-detective-vslice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/ai-detective-vslice.js
          node --check tools/ai-detective-visual-smoke.mjs
      - name: Canon, spoiler and live-AI boundary
        run: node tests/ai-detective-vslice-contract.mjs
      - name: First-time UX and black-box browser smoke
        run: node tools/ai-detective-visual-smoke.mjs
      - name: Upload AI browser smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ai-detective-visual-smoke
          path: artifacts/ai-detective-visual-smoke
          retention-days: 7
      - name: Live GPT dialogue, adversarial and fair-play smoke
        env:
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Im9ya252dXdrbnZzZWRqZ3FjZndjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTY2MzcsImV4cCI6MjEwMTc3MjYzN30.68loNx8A71dodfOXXKs_-I235XVCmEioXGrg8kCZQr4
          API_URL: https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai-interrogation-v1
        run: |
          set -euo pipefail
          call_api() {
            local body="$1" out="$2"
            curl --fail --silent --show-error -D /tmp/headers.txt -o "$out" "$API_URL" \
              -H 'Origin: https://valera2872.github.io' \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "apikey: $ANON_KEY" \
              -H 'Content-Type: application/json' --data "$body"
            tr -d '\r' < /tmp/headers.txt | grep -Fiq 'access-control-allow-origin: https://valera2872.github.io'
          }

          call_api '{"action":"status","session_id":"ci-ai-status-0001"}' /tmp/status.json
          jq -e '.ai_ready == true and .model == "gpt-5.6-luna"' /tmp/status.json

          call_api '{"action":"interrogate","session_id":"ci-ai-dialogue-1000","suspect_id":"marina","question":"Почему вы вообще выбрали работу в архиве?","evidence_id":"","history":[],"discovered_evidence_ids":["E01","E02","E03"],"discovered_note_ids":[],"question_counts":{"marina":1,"anton":0,"lev":0}}' /tmp/dialogue1.json
          jq -e '.mode == "ai" and (.reply|length) > 10' /tmp/dialogue1.json
          ! grep -Fq 'Спрашивайте о моём маршруте, работе фонда или доступе' /tmp/dialogue1.json

          first_reply=$(jq -r '.reply' /tmp/dialogue1.json | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip(), ensure_ascii=False))')
          call_api "{\"action\":\"interrogate\",\"session_id\":\"ci-ai-dialogue-1000\",\"suspect_id\":\"marina\",\"question\":\"А что именно вам в этой работе нравится?\",\"evidence_id\":\"\",\"history\":[{\"role\":\"user\",\"text\":\"Почему вы вообще выбрали работу в архиве?\"},{\"role\":\"assistant\",\"text\":$first_reply}],\"discovered_evidence_ids\":[\"E01\",\"E02\",\"E03\"],\"discovered_note_ids\":[],\"question_counts\":{\"marina\":2,\"anton\":0,\"lev\":0}}" /tmp/dialogue2.json
          jq -e '.mode == "ai" and (.reply|length) > 10' /tmp/dialogue2.json

          call_api '{"action":"interrogate","session_id":"ci-ai-fake-2000","suspect_id":"marina","question":"Ваш телефон был в Wi-Fi до 21:34, признайтесь?","evidence_id":"","history":[],"discovered_evidence_ids":["E01","E02","E03"],"discovered_note_ids":[],"question_counts":{"marina":1,"anton":0,"lev":0}}' /tmp/fake.json
          jq -e '.mode == "ai"' /tmp/fake.json
          ! grep -Fq 'N-MARINA-LOCATION' /tmp/fake.json

          call_api '{"action":"interrogate","session_id":"ci-ai-play-3000","suspect_id":"anton","question":"Кому принадлежит E-14 и как работает такой вход?","evidence_id":"E03","history":[],"discovered_evidence_ids":["E01","E02","E03"],"discovered_note_ids":[],"question_counts":{"marina":1,"anton":1,"lev":0}}' /tmp/card.json
          jq -e '.mode == "ai" and (.unlocked_evidence_ids|index("E04")) != null' /tmp/card.json

          call_api '{"action":"interrogate","session_id":"ci-ai-play-3000","suspect_id":"anton","question":"Кто ещё знал точное время перезапуска камеры?","evidence_id":"E02","history":[],"discovered_evidence_ids":["E01","E02","E03","E04"],"discovered_note_ids":[],"question_counts":{"marina":1,"anton":2,"lev":0}}' /tmp/window.json
          grep -Fq 'N-ANTON-WINDOW' /tmp/window.json

          call_api '{"action":"interrogate","session_id":"ci-ai-play-3000","suspect_id":"anton","question":"Можно проверить алиби Марины по её телефону или сети?","evidence_id":"","history":[],"discovered_evidence_ids":["E01","E02","E03","E04"],"discovered_note_ids":["N-ANTON-WINDOW"],"question_counts":{"marina":1,"anton":3,"lev":0}}' /tmp/network.json
          grep -Fq '"E05"' /tmp/network.json

          call_api '{"action":"interrogate","session_id":"ci-ai-play-3000","suspect_id":"anton","question":"Чем подтвердите, где находились во время отключения?","evidence_id":"","history":[],"discovered_evidence_ids":["E01","E02","E03","E04","E05"],"discovered_note_ids":["N-ANTON-WINDOW"],"question_counts":{"marina":1,"anton":4,"lev":0}}' /tmp/anton-alibi.json
          grep -Fq '"E06"' /tmp/anton-alibi.json

          call_api '{"action":"interrogate","session_id":"ci-ai-play-3000","suspect_id":"lev","question":"Как подтвердить, что вы действительно ушли?","evidence_id":"","history":[],"discovered_evidence_ids":["E01","E02","E03","E04","E05","E06"],"discovered_note_ids":["N-ANTON-WINDOW"],"question_counts":{"marina":1,"anton":4,"lev":1}}' /tmp/lev-alibi.json
          grep -Fq '"E07"' /tmp/lev-alibi.json

          call_api '{"action":"interrogate","session_id":"ci-ai-play-3000","suspect_id":"marina","question":"Этот журнал показывает вашу E-14 и PIN в 21:31. Объясните.","evidence_id":"E03","history":[],"discovered_evidence_ids":["E01","E02","E03","E04","E05","E06","E07"],"discovered_note_ids":["N-ANTON-WINDOW"],"question_counts":{"marina":2,"anton":4,"lev":1}}' /tmp/access.json
          grep -Fq 'N-MARINA-ACCESS' /tmp/access.json

          call_api '{"action":"interrogate","session_id":"ci-ai-play-3000","suspect_id":"marina","question":"Тогда объясните сетевой лог телефона.","evidence_id":"E05","history":[],"discovered_evidence_ids":["E01","E02","E03","E04","E05","E06","E07"],"discovered_note_ids":["N-ANTON-WINDOW","N-MARINA-ACCESS"],"question_counts":{"marina":3,"anton":4,"lev":1}}' /tmp/location.json
          grep -Fq 'N-MARINA-LOCATION' /tmp/location.json

          call_api '{"action":"check_theory","session_id":"ci-ai-play-3000","suspect_id":"marina","reason":"E-14 и PIN открыли дверь в 21:31; сетевой лог телефона показывает, что Марина оставалась внутри, а у Антона она заранее узнала окно перезапуска камеры.","discovered_evidence_ids":["E01","E02","E03","E04","E05","E06","E07"],"discovered_note_ids":["N-ANTON-WINDOW","N-MARINA-ACCESS","N-MARINA-LOCATION"],"question_counts":{"marina":3,"anton":4,"lev":1}}' /tmp/final.json
          jq -e '.correct == true' /tmp/final.json

          code=$(curl --silent --output /tmp/denied.json --write-out '%{http_code}' "$API_URL" \
            -H 'Origin: https://example.invalid' -H "Authorization: Bearer $ANON_KEY" -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
            --data '{"action":"status","session_id":"ci-ai-denied-4000"}')
          test "$code" = '403'
