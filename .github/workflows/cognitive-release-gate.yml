name: Validate Cognitive Release Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cognitive-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check assets/cognitive-short-case.js
          node --check assets/cognitive-solo-analytics.js
          node --check assets/cognitive-coop-analytics.js
          node --check assets/cognitive-coop-407.js
          node --check assets/cognitive-last-aria.js
          node --check assets/catalog-experience.js
          node --check tools/import-mobile/case-v4-postprocess.mjs
          node --check tools/import-mobile/coop-v4-postprocess.mjs
          node --check tools/import-mobile/solo-407-player-feedback-postprocess.mjs
          node --check tools/validate-cognitive-release-gate.mjs
      - name: Validate cognitive contracts
        run: node tools/validate-cognitive-release-gate.mjs
