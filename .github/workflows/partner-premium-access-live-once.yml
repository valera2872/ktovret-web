name: One-time Premium Partner paid access live smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/smoke-partner-premium-access-v1-once.mjs'
      - '.github/workflows/partner-premium-access-live-once.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise deployed paid access gate
        run: node tools/smoke-partner-premium-access-v1-once.mjs
