name: Deploy Mystery Logic to Beget

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful production-beget run ID; leave empty to use latest successful main run"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: mysterylogic-beget-production
  cancel-in-progress: false

jobs:
  deploy-beget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve validated production bundle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$INPUT_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow production-beget.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id" || { echo "No successful production bundle run found" >&2; exit 1; }
          run_json="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,conclusion,name)"
          head_sha="$(jq -r '.headSha' <<<"$run_json")"
          head_branch="$(jq -r '.headBranch' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          workflow_name="$(jq -r '.name' <<<"$run_json")"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [ "$workflow_name" = "Build Mystery Logic production bundle for Beget" ] || { echo "Wrong source workflow: $workflow_name" >&2; exit 1; }
          [ "$conclusion" = "success" ] || { echo "Production run is not successful: $conclusion" >&2; exit 1; }
          [ "$head_branch" = "main" ] || { echo "Production run is not from main: $head_branch" >&2; exit 1; }
          if [ "$head_sha" != "$main_sha" ]; then
            changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$head_sha...$main_sha" --jq '.files[].filename')"
            test -n "$changed" || { echo "Could not verify main delta" >&2; exit 1; }
            unsafe="$(printf '%s\n' "$changed" | grep -v '^\.github/workflows/deploy-beget\.yml$' || true)"
            [ -z "$unsafe" ] || { echo "Refusing stale artifact; product files changed after build:" >&2; printf '%s\n' "$unsafe" >&2; exit 1; }
            echo "Artifact predates main only by deploy-beget.yml; runtime payload remains valid."
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "release=${head_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Using production bundle run $run_id for $head_sha"

      - name: Download validated Beget artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name mysterylogic-beget-production --dir artifact
          test -s artifact/mysterylogic-beget-production.zip

      - name: Unpack and revalidate deployment payload
        env:
          RELEASE: ${{ steps.source.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p production-web
          unzip -q artifact/mysterylogic-beget-production.zip -d production-web
          test -f production-web/index.html
          test -f production-web/.htaccess
          test -f production-web/robots.txt
          test -f production-web/sitemap.xml
          test -f production-web/tom-1/index.html
          test -f production-web/detektivnye-igry-dlya-dvoih/index.html
          test -f production-web/detektivnye-igry-dlya-dvoih/poslednyaya-ariya/index.html
          test -f production-web/detektivnye-igry-dlya-dvoih/ne-publikovat/index.html
          test -f production-web/assets/partner-premium-v2.js
          test -f production-web/assets/partner-premium-v2.css
          test -f production-web/assets/partner-premium-commerce-v1.js
          test -f production-web/assets/partner-premium-commerce-v1.css
          test ! -e production-web/admin/partner-premium-preview
          test ! -d production-web/supabase
          test ! -d production-web/tools
          test ! -d production-web/tests
          grep -Fq '"totalCases": 100' production-web/assets/generated/import-report.json
          grep -Fq '199 ₽' production-web/tom-1/index.html
          grep -Fq '<meta name="robots" content="noindex,nofollow,noarchive">' production-web/detektivnye-igry-dlya-dvoih/ne-publikovat/index.html
          grep -Fq '<link rel="canonical" href="https://mysterylogic.com/detektivnye-igry-dlya-dvoih/ne-publikovat/">' production-web/detektivnye-igry-dlya-dvoih/ne-publikovat/index.html
          grep -Fq '599 ₽ за всю комнату' production-web/detektivnye-igry-dlya-dvoih/ne-publikovat/index.html
          grep -Fq "partner-premium-v2.js?v=$RELEASE" production-web/detektivnye-igry-dlya-dvoih/ne-publikovat/index.html
          grep -Fq "partner-premium-commerce-v1.js?v=$RELEASE" production-web/detektivnye-igry-dlya-dvoih/ne-publikovat/index.html
          grep -Fq "?v=$RELEASE" production-web/index.html
          echo "Payload revalidated for release $RELEASE"

      - name: Require Beget deployment configuration
        id: config
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_PATH: ${{ secrets.BEGET_PATH }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$BEGET_HOST" ] || missing+=(BEGET_HOST)
          [ -n "$BEGET_USER" ] || missing+=(BEGET_USER)
          [ -n "$BEGET_PASSWORD" ] || missing+=(BEGET_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Beget deploy is not configured. Missing Actions secrets: ${missing[*]}. Optional: BEGET_PATH (default mysterylogic.com/public_html), BEGET_PORT (default 22)."
            exit 1
          fi
          remote_path="${BEGET_PATH:-mysterylogic.com/public_html}"
          port="${BEGET_PORT:-22}"
          [ -n "$remote_path" ] && [ "$remote_path" != "/" ] || { echo "Unsafe BEGET_PATH" >&2; exit 1; }
          [[ "$remote_path" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "BEGET_PATH contains unsafe characters" >&2; exit 1; }
          [[ "$remote_path" != *".."* ]] || { echo "BEGET_PATH must not contain .." >&2; exit 1; }
          case "$port" in (*[!0-9]*|'') echo "Invalid BEGET_PORT" >&2; exit 1;; esac
          echo "remote_path=$remote_path" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Prepare encrypted SSH transport
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_PORT: ${{ steps.config.outputs.port }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$BEGET_PORT" -H "$BEGET_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Guard target and create rollback archive
        id: backup
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_PORT: ${{ steps.config.outputs.port }}
          BEGET_PATH: ${{ steps.config.outputs.remote_path }}
          RELEASE: ${{ steps.source.outputs.release }}
        run: |
          set -euo pipefail
          export SSHPASS="$BEGET_PASSWORD"
          target="$BEGET_USER@$BEGET_HOST"
          backup_name="mysterylogic-${RELEASE}-$(date -u +%Y%m%dT%H%M%SZ).tgz"
          sshpass -e ssh -p "$BEGET_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$target" \
            "set -eu; test -d '$BEGET_PATH'; test -f '$BEGET_PATH/index.html'; grep -Eqi 'Mystery Logic|Детективные игры|Кто врёт' '$BEGET_PATH/index.html'; files=\$(find '$BEGET_PATH' -type f | wc -l); test \"\$files\" -ge 50; test \"\$files\" -le 5000; mkdir -p \"\$HOME/.mysterylogic-deploy-backups\"; tar -C '$BEGET_PATH' -czf \"\$HOME/.mysterylogic-deploy-backups/$backup_name\" ."
          echo "backup_name=$backup_name" >> "$GITHUB_OUTPUT"
          echo "Beget target guard passed; rollback archive created"

      - name: Preview rsync changes
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_PORT: ${{ steps.config.outputs.port }}
          BEGET_PATH: ${{ steps.config.outputs.remote_path }}
        run: |
          set -euo pipefail
          export SSHPASS="$BEGET_PASSWORD"
          target="$BEGET_USER@$BEGET_HOST"
          rsync -azn --delete-delay --delay-updates --itemize-changes \
            --exclude='.well-known/' --exclude='.well-known/***' --exclude='.user.ini' \
            -e "sshpass -e ssh -p $BEGET_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            production-web/ "$target:$BEGET_PATH/" | tee /tmp/rsync-dry-run.txt
          echo "Dry-run change lines: $(wc -l < /tmp/rsync-dry-run.txt)"

      - name: Deploy validated runtime to Beget
        id: deploy
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_PORT: ${{ steps.config.outputs.port }}
          BEGET_PATH: ${{ steps.config.outputs.remote_path }}
        run: |
          set -euo pipefail
          export SSHPASS="$BEGET_PASSWORD"
          target="$BEGET_USER@$BEGET_HOST"
          rsync -az --delete-delay --delay-updates \
            --exclude='.well-known/' --exclude='.well-known/***' --exclude='.user.ini' \
            -e "sshpass -e ssh -p $BEGET_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            production-web/ "$target:$BEGET_PATH/"

      - name: Smoke live Mystery Logic
        id: smoke
        env:
          RELEASE: ${{ steps.source.outputs.release }}
        run: |
          set -euo pipefail
          fetch() { curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$1"; }
          fetch 'https://mysterylogic.com/' > /tmp/home.html
          fetch 'https://mysterylogic.com/tom-1/' > /tmp/tom1.html
          fetch 'https://mysterylogic.com/detektivnye-igry-dlya-dvoih/' > /tmp/duo.html
          fetch 'https://mysterylogic.com/detektivnye-igry-dlya-dvoih/poslednyaya-ariya/' > /tmp/aria.html
          fetch 'https://mysterylogic.com/detektivnye-igry-dlya-dvoih/ne-publikovat/' > /tmp/partner.html
          grep -Fq "?v=$RELEASE" /tmp/home.html
          grep -Fq '199 ₽' /tmp/tom1.html
          grep -Fq 'Последняя ария' /tmp/duo.html
          ! grep -Fq 'ne-publikovat' /tmp/duo.html
          grep -Fq '<title>Не публиковать — Premium Partner | Mystery Logic</title>' /tmp/partner.html
          grep -Fq 'noindex,nofollow,noarchive' /tmp/partner.html
          grep -Fq '599 ₽ за всю комнату' /tmp/partner.html
          grep -Fq "partner-premium-v2.js?v=$RELEASE" /tmp/partner.html
          grep -Fq "partner-premium-commerce-v1.js?v=$RELEASE" /tmp/partner.html
          echo "Live Mystery Logic smoke passed for $RELEASE"

      - name: Roll back automatically if deploy or live smoke fails
        if: failure() && steps.backup.outputs.backup_name != '' && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_PORT: ${{ steps.config.outputs.port }}
          BEGET_PATH: ${{ steps.config.outputs.remote_path }}
          BACKUP_NAME: ${{ steps.backup.outputs.backup_name }}
        run: |
          set -euo pipefail
          export SSHPASS="$BEGET_PASSWORD"
          target="$BEGET_USER@$BEGET_HOST"
          sshpass -e ssh -p "$BEGET_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$target" \
            "set -eu; rm -rf '$BEGET_PATH'/* '$BEGET_PATH'/.[!.]* '$BEGET_PATH'/..?* 2>/dev/null || true; tar -xzf \"\$HOME/.mysterylogic-deploy-backups/$BACKUP_NAME\" -C '$BEGET_PATH'"
          echo "::error::Deployment failed; previous files were restored from $BACKUP_NAME"

      - name: Prune old rollback archives
        if: success()
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_PORT: ${{ steps.config.outputs.port }}
        run: |
          set -euo pipefail
          export SSHPASS="$BEGET_PASSWORD"
          target="$BEGET_USER@$BEGET_HOST"
          sshpass -e ssh -p "$BEGET_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$target" \
            'set -eu; dir="$HOME/.mysterylogic-deploy-backups"; test -d "$dir" || exit 0; ls -1t "$dir"/mysterylogic-*.tgz 2>/dev/null | tail -n +6 | while IFS= read -r old; do rm -f "$old"; done'

      - name: Deployment summary
        if: always()
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          RELEASE: ${{ steps.source.outputs.release }}
          BACKUP_NAME: ${{ steps.backup.outputs.backup_name }}
        run: |
          {
            echo '## Beget manual deployment'
            echo
            echo "- production run: ${RUN_ID:-not resolved}"
            echo "- source SHA: ${HEAD_SHA:-not resolved}"
            echo "- release: ${RELEASE:-not resolved}"
            echo "- rollback archive: ${BACKUP_NAME:-not created}"
            echo "- Premium Partner route: /detektivnye-igry-dlya-dvoih/ne-publikovat/"
          } >> "$GITHUB_STEP_SUMMARY"
