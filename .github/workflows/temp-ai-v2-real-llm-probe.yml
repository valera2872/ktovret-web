name: TEMP AI v2 real LLM probe

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ai-v2-real-llm-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute one-shot server-side LLM smoke
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body -sS 'https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai-v2-real-llm-probe?probe=c5056514a413c83cec6b1a23fa369099fd78e82fc3678f609fb5aaf5a4f4401f')"
          PROBE_JSON="$body" node <<'NODE'
          const d=JSON.parse(process.env.PROBE_JSON||'{}');
          if(!d.ok) throw new Error(`probe_failed:${JSON.stringify(d)}`);
          if(d.already_run){console.log('ALREADY_RUN');process.exit(0)}
          if(!d.model||!(d.reply_length>=5)||!(d.usage?.input_tokens>0)||!(d.usage?.output_tokens>0)||!(d.usage?.cost_usd>=0)) throw new Error(`model_contract_failed:${JSON.stringify(d)}`);
          if(d.new_notes!==0||d.new_evidence!==0||d.successful_turns!==1||d.persisted!==true) throw new Error(`state_contract_failed:${JSON.stringify(d)}`);
          console.log('MODEL',d.model);
          console.log('REPLY_LENGTH',d.reply_length);
          console.log('EXPECTED_FACT',d.reply_has_expected_fact);
          console.log('USAGE',JSON.stringify(d.usage));
          console.log('REAL_LLM_PRODUCTION_SMOKE_OK');
          NODE
