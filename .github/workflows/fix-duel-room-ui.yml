name: Apply duel lobby state fix

on:
  push:
    branches:
      - feat/two-player-rooms

permissions:
  contents: write

jobs:
  fix_duel_lobby:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/two-player-rooms
          fetch-depth: 0

      - name: Keep start enabled after the second player joins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/duel-room.js')
          text = path.read_text(encoding='utf-8')
          old = "const startDisabled = !state.bothJoined || busy;"
          new = "const startDisabled = !state.bothJoined;"
          if old not in text:
              raise SystemExit('expected duel lobby line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'const startDisabled = !state.bothJoined;' assets/duel-room.js

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-duel-room-ui.yml
          git add assets/duel-room.js
          git diff --cached --check
          git commit -m 'fix: enable duel start immediately after join'
          git push origin HEAD:feat/two-player-rooms
