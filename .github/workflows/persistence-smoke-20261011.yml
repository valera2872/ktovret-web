name: Persistence paid release smoke 2026-10-11

on:
  push:
    paths:
      - '.github/workflows/persistence-smoke-20261011.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Production paid persistence save load reset
        shell: bash
        env:
          ENDPOINT: https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/player-dossier
          BROWSER_KEY: 7055132e93b7e068790ca3e219cfcc3cea6c2af255dc075c
          ACCESS_TOKEN: ml_qa_U3Ot8MrmkwiEtNJKjL77AwuGHQQuuLkqzjQu9Wd9fG9joDyh
        run: |
          set -euo pipefail
          smoke_case() {
            case_id="$1"
            label="$2"
            marker="$label-$(date +%s)-$RANDOM"

            save_payload=$(node -e 'console.log(JSON.stringify({action:"progress_save",browserKey:process.env.BROWSER_KEY,caseId:process.argv[1],state:{smoke:process.argv[2],stage:3,completed:false},summary:{status:"started",progressPct:41,title:"Paid persistence smoke",route:"/qa-smoke/",lastStage:"Stage 3",format:"solo-premium"}}))' "$case_id" "$marker")
            save=$(curl -fsS --retry 2 --max-time 30 -H 'Origin: https://mysterylogic.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $ACCESS_TOKEN" --data "$save_payload" "$ENDPOINT")
            echo "$label SAVE=$save"
            SAVE="$save" node -e 'const j=JSON.parse(process.env.SAVE); if(j.ok!==true||Number(j.revision)!==1||j.status!=="started") process.exit(1)'

            load_payload=$(node -e 'console.log(JSON.stringify({action:"progress_load",browserKey:process.env.BROWSER_KEY,caseId:process.argv[1]}))' "$case_id")
            load=$(curl -fsS --retry 2 --max-time 30 -H 'Origin: https://mysterylogic.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $ACCESS_TOKEN" --data "$load_payload" "$ENDPOINT")
            echo "$label LOAD=$load"
            LOAD="$load" MARKER="$marker" node -e 'const j=JSON.parse(process.env.LOAD); if(j.ok!==true||Number(j.revision)!==1||j.state?.smoke!==process.env.MARKER||j.resume?.server!==true||j.resume?.viaEntitlement!==true) process.exit(1)'

            save2_payload=$(node -e 'console.log(JSON.stringify({action:"progress_save",browserKey:process.env.BROWSER_KEY,caseId:process.argv[1],revision:1,state:{smoke:process.argv[2],stage:5,completed:false},summary:{status:"started",progressPct:72,title:"Paid persistence smoke",route:"/qa-smoke/",lastStage:"Stage 5",format:"solo-premium"}}))' "$case_id" "$marker")
            save2=$(curl -fsS --retry 2 --max-time 30 -H 'Origin: https://mysterylogic.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $ACCESS_TOKEN" --data "$save2_payload" "$ENDPOINT")
            echo "$label SAVE2=$save2"
            SAVE2="$save2" node -e 'const j=JSON.parse(process.env.SAVE2); if(j.ok!==true||Number(j.revision)!==2||j.status!=="started") process.exit(1)'

            reset_payload=$(node -e 'console.log(JSON.stringify({action:"progress_reset",browserKey:process.env.BROWSER_KEY,caseId:process.argv[1]}))' "$case_id")
            reset=$(curl -fsS --retry 2 --max-time 30 -H 'Origin: https://mysterylogic.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $ACCESS_TOKEN" --data "$reset_payload" "$ENDPOINT")
            echo "$label RESET=$reset"
            RESET="$reset" node -e 'const j=JSON.parse(process.env.RESET); if(j.ok!==true||j.reset!==true) process.exit(1)'

            after=$(curl -fsS --retry 2 --max-time 30 -H 'Origin: https://mysterylogic.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $ACCESS_TOKEN" --data "$load_payload" "$ENDPOINT")
            echo "$label AFTER_RESET=$after"
            AFTER="$after" node -e 'const j=JSON.parse(process.env.AFTER); if(j.ok!==true||j.state!==null||Number(j.revision)!==0||j.resume?.server!==false) process.exit(1)'
          }

          smoke_case premium_tikhaya_noch_v1 TIKHAYA
          smoke_case web_v2r2_101_room_241 SOLO99
