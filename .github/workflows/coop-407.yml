name: Validate Mystery Logic Room 407

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-407:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source syntax
        run: |
          node --check assets/case-407-data.js
          node --check assets/case-407-detective-audit-v4.js
          node --check assets/case-407-detective-proof-v4.js
          node --check assets/case-407-plaque-code-v2.js
          node --check assets/case-407.js
          node --check assets/case-407-playtest-ux-v42.js
          node --check assets/case-407-evidence-v2.js
          node --check assets/case-407-evidence-finalize.js
          node --check assets/case-407-detective-visual-v4.js
          node --check tools/import-mobile/two-player-407-postprocess.mjs
          node --check tools/validate-case-407.mjs
          node --check tools/validate-case-407-evidence-v2.mjs
          node --check tools/validate-case-407-plaque-code.mjs
          node --check tools/validate-case-407-detective-v4.mjs
          node --check tools/validate-case-407-countertheories-v4.mjs
          node --check tools/validate-case-407-playtest-v42.mjs
          node --check tools/room-407-playtest-ux-smoke.mjs
          node --check tools/room-407-evidence-visual-smoke.mjs
          node --check tools/room-407-detective-visual-smoke.mjs
          node --check tools/two-player-407-smoke.mjs
      - name: Validate base product and fair-play boundary
        run: node tools/validate-case-407.mjs
      - name: Validate materialized evidence layer
        run: node tools/validate-case-407-evidence-v2.mjs
      - name: Validate opaque identifier boundary
        run: node tools/validate-case-407-plaque-code.mjs
      - name: Adversarial Holmes-Poirot validation
        run: node tools/validate-case-407-detective-v4.mjs
      - name: Reject principal counter-theories
        run: node tools/validate-case-407-countertheories-v4.mjs
      - name: Blind two-role playtest regression
        run: node tools/validate-case-407-playtest-v42.mjs
      - name: Browser smoke blind-playtest co-op UX
        run: node tools/room-407-playtest-ux-smoke.mjs
      - name: Render legacy role-specific evidence packets
        run: node tools/room-407-evidence-visual-smoke.mjs
      - name: Render detective-v4 role-specific evidence packets
        run: node tools/room-407-detective-visual-smoke.mjs
      - name: Upload role-specific evidence screenshots
        uses: actions/upload-artifact@v4
        with:
          name: room-407-evidence-visual-smoke
          path: |
            artifacts/room-407-evidence-smoke/
            artifacts/room-407-detective-v4/
            artifacts/room-407-playtest-ux/
          retention-days: 7
      - name: Live room contract smoke
        env:
          ENDPOINT: https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/coop-407
        run: |
          node <<'NODE'
          const { randomBytes } = require('node:crypto');
          (async () => {
            const endpoint = process.env.ENDPOINT;
            const origin = 'https://mysterylogic.com';
            const k1 = randomBytes(24).toString('hex');
            const k2 = randomBytes(24).toString('hex');
            const post = async (body, expected = 200) => {
              const response = await fetch(endpoint, {
                method: 'POST', headers: { 'content-type': 'application/json', origin }, body: JSON.stringify(body),
              });
              const text = await response.text();
              let payload = {};
              try { payload = JSON.parse(text); } catch {}
              if (response.status !== expected) throw new Error(`${body.action}: HTTP ${response.status} ${text}`);
              return payload;
            };
            const created = await post({ action: 'create', browserKey: k1, playerName: 'CI Investigator 407' }, 201);
            if (created.me?.role !== 'creator' || created.room?.caseId !== 'special:407') throw new Error('create contract mismatch');
            const code = created.room.code;
            const preview = await post({ action: 'preview', browserKey: k2, code });
            if (preview.roomFull || !preview.creatorName) throw new Error('preview contract mismatch');
            const joined = await post({ action: 'join', browserKey: k2, code, playerName: 'CI Analyst 407' });
            if (!joined.bothJoined || joined.me?.role !== 'guest') throw new Error('join contract mismatch');
            await post({ action: 'start', browserKey: k1, code });
            await post({ action: 'start', browserKey: k2, code });
            const first = await post({ action: 'complete', browserKey: k1, code, elapsedSeconds: 180, hintsUsed: 0, attempts: 1, firstAnswerCorrect: true });
            if (first.bothCompleted) throw new Error('room completed before second player');
            const second = await post({ action: 'complete', browserKey: k2, code, elapsedSeconds: 210, hintsUsed: 1, attempts: 2, firstAnswerCorrect: false });
            if (!second.bothCompleted || second.results?.guest?.name !== 'CI Analyst 407') throw new Error('result contract mismatch');
            console.log(`coop-407 live contract passed for room ${code}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
