name: Validate Solo guided preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/solo-guided-preview/**'
      - 'assets/solo-investigation-v1.js'
      - 'assets/solo-investigation-v1.css'
      - 'assets/solo-guided-preview.css'
      - 'assets/solo-guided-access-v1.js'
      - 'assets/solo-guided-interrogation-v1.js'
      - 'assets/solo-guided-interrogation-v1.css'
      - 'assets/solo-guided-confrontation-v1.css'
      - 'supabase/functions/solo-session-v2/**'
      - 'supabase/functions/solo-guided-interrogate-v1/**'
      - 'supabase/functions/solo-guided-interrogate-public-v1/**'
      - 'tools/validate-solo-guided-preview-v3.mjs'
      - '.github/workflows/solo-guided-preview.yml'
  push:
    branches: [main]
    paths:
      - 'admin/solo-guided-preview/**'
      - 'assets/solo-investigation-v1.js'
      - 'assets/solo-investigation-v1.css'
      - 'assets/solo-guided-preview.css'
      - 'assets/solo-guided-access-v1.js'
      - 'assets/solo-guided-interrogation-v1.js'
      - 'assets/solo-guided-interrogation-v1.css'
      - 'assets/solo-guided-confrontation-v1.css'
      - 'supabase/functions/solo-session-v2/**'
      - 'supabase/functions/solo-guided-interrogate-v1/**'
      - 'supabase/functions/solo-guided-interrogate-public-v1/**'
      - 'tools/validate-solo-guided-preview-v3.mjs'
      - '.github/workflows/solo-guided-preview.yml'

jobs:
  validate-guided-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate client syntax
        run: |
          node --check assets/solo-guided-access-v1.js
          node --check assets/solo-investigation-v1.js
          node --check assets/solo-guided-interrogation-v1.js
      - name: Validate player-led investigation contract
        run: node tools/validate-solo-guided-preview-v3.mjs
      - name: Protect Russian player copy
        run: |
          ! grep -n '—' admin/solo-guided-preview/index.html
          ! grep -n '—' assets/solo-guided-access-v1.js
          ! grep -n '—' assets/solo-investigation-v1.js
          ! grep -n '—' assets/solo-guided-interrogation-v1.js
