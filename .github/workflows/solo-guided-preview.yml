name: Validate Solo guided preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/solo-guided-preview/**'
      - 'assets/solo-guided-preview-v3.js'
      - 'assets/solo-guided-preview.css'
      - 'tools/validate-solo-guided-preview-v3.mjs'
      - '.github/workflows/solo-guided-preview.yml'
  push:
    branches: [main]
    paths:
      - 'admin/solo-guided-preview/**'
      - 'assets/solo-guided-preview-v3.js'
      - 'assets/solo-guided-preview.css'
      - 'tools/validate-solo-guided-preview-v3.mjs'
      - '.github/workflows/solo-guided-preview.yml'

jobs:
  validate-guided-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate client syntax
        run: node --check assets/solo-guided-preview-v3.js
      - name: Validate no-boot startup contract
        run: node tools/validate-solo-guided-preview-v3.mjs
      - name: Protect Russian player copy
        run: |
          ! grep -n '—' admin/solo-guided-preview/index.html
          ! grep -n '—' assets/solo-guided-preview-v3.js
