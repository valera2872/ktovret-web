name: AI02 staging pages
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check assets/ai-case-player-v2.js
          node --check assets/ai02-investigation-staging.js
          node --check assets/ai02-investigator-workspace.js
          node tests/ai02-investigator-workspace-contract.mjs
          grep -q "noindex,nofollow" staging-previews/ai02/index.html
          grep -q "ai02-investigation-staging.js" staging-previews/ai02/index.html
      - name: Assemble
        run: |
          mkdir -p out/ai02 out/assets/ai02
          cp staging-previews/ai02/index.html out/ai02/index.html
          cp assets/ml-mark.svg out/assets/
          cp assets/mysterylogic.css out/assets/
          cp assets/ai-detective-vslice.css out/assets/
          cp assets/ai-detective-avatar-stage.css out/assets/
          cp assets/ai-case-player-v2.css out/assets/
          cp assets/ai02-premium.css out/assets/
          cp -R assets/ai02/. out/assets/ai02/
          cp assets/ai02-investigation-staging.js out/assets/
          cp assets/ai02-investigator-workspace.js out/assets/
          cp assets/ai02-portraits.js out/assets/
          cp assets/legal.css out/assets/
          cp assets/typography-polish.css out/assets/
          cp assets/interface-polish.css out/assets/
          cp assets/logic-sitewide.css out/assets/
          cp assets/ai01-launch-promo.css out/assets/
          cp assets/conversion-ux.css out/assets/
          cp assets/ai-case-player-v2.js out/assets/
          cp assets/ai-case-live-v2.js out/assets/
          printf '%s\n' '<meta name="robots" content="noindex,nofollow"><a href="./ai02/?case=AI02-NK-STANDARD">AI-02</a>' > out/index.html
          printf '%s\n' 'User-agent: *' 'Disallow: /' > out/robots.txt
          touch out/.nojekyll
      - name: Visual preview
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory out >/tmp/ai02-http.log 2>&1 &
          sleep 2
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const desktop = await browser.newPage({viewport:{width:1440,height:1000}, deviceScaleFactor:1});
            await desktop.goto('http://127.0.0.1:4173/ai02/?case=AI02-NK-STANDARD',{waitUntil:'domcontentloaded'});
            await desktop.reload({waitUntil:'networkidle'});
            await desktop.waitForTimeout(2500);
            await desktop.screenshot({path:'ai02-desktop.png',fullPage:true});
            const mobile = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            await mobile.goto('http://127.0.0.1:4173/ai02/?case=AI02-NK-STANDARD',{waitUntil:'domcontentloaded'});
            await mobile.reload({waitUntil:'networkidle'});
            await mobile.waitForTimeout(2500);
            await mobile.screenshot({path:'ai02-mobile.png',fullPage:true});
            await browser.close();
          })();
          NODE
      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: ai02-visual-preview
          path: |
            ai02-desktop.png
            ai02-mobile.png
          retention-days: 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed staging visually
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const url='https://valera2872.github.io/ktovret-web/ai02/?case=AI02-NK-STANDARD&preview=workspace';
            const browser=await chromium.launch({headless:true});
            for (const cfg of [
              {name:'desktop',width:1440,height:1000},
              {name:'mobile',width:390,height:844}
            ]) {
              const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height},deviceScaleFactor:1});
              await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(1500);
              const checks=await page.evaluate(()=>{
                const hero=document.querySelector('.aid-scene-photo img');
                const portraits=[...document.querySelectorAll('.aid02-final-thumb')];
                return {
                  title:document.title,
                  hero:!!hero&&hero.complete&&hero.naturalWidth>0,
                  portraitCount:portraits.filter(x=>x.complete&&x.naturalWidth>0).length,
                  workspace:!document.querySelector('[data-view="workspace"]')?.hidden,
                  difficultyButtons:document.querySelectorAll('[data-difficulty-case]').length,
                  investigatorTabs:document.querySelectorAll('[data-ai02-subview]').length,
                  hotspots:document.querySelectorAll('[data-scene-query]').length,
                  notebookTabs:document.querySelectorAll('[data-ai02-note-tab]').length
                };
              });
              if(!checks.hero||!checks.workspace||checks.portraitCount<5||checks.difficultyButtons!==3||checks.investigatorTabs!==3||checks.hotspots<5||checks.notebookTabs<3) throw new Error(cfg.name+' visual check failed '+JSON.stringify(checks));
              await page.click('[data-ai02-subview="timeline"]');
              if(await page.locator('[data-ai02-panel="timeline"]').isHidden()) throw new Error(cfg.name+' timeline did not open');
              await page.click('[data-ai02-subview="board"]');
              if(await page.locator('[data-ai02-panel="board"]').isHidden()) throw new Error(cfg.name+' board did not open');
              await page.click('[data-ai02-subview="scene"]');
              await page.click('[data-mode-switch="interrogation"]');
              await page.waitForTimeout(250);
              await page.screenshot({path:'deployed-'+cfg.name+'.png',fullPage:true});
              await page.close();
            }
            await browser.close();
          })();
          NODE
      - name: Upload deployed visual check
        uses: actions/upload-artifact@v4
        with:
          name: ai02-deployed-visual-check
          path: |
            deployed-desktop.png
            deployed-mobile.png
          retention-days: 2

