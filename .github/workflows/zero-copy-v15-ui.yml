name: Zero Copy V15 UI
on:
  push:
    branches: [feature/zero-copy-runtime-final]
    paths:
      - 'qa-zero-copy/client/**'
      - 'qa-zero-copy/ui-e2e.mjs'
      - '.github/workflows/zero-copy-v15-ui.yml'
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y && npm i -D playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Serve exact v15 client
        run: |
          python3 -m http.server 4173 --directory qa-zero-copy >/tmp/zc-http.log 2>&1 &
          sleep 2
      - name: Run v15 UI E2E
        run: node qa-zero-copy/ui-e2e.mjs
