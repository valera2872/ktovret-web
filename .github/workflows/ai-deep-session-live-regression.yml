name: AI deep-session live regression

on:
  push:
    branches: [fix/ai-confession-deep-session-fallback]
    paths:
      - '.github/workflows/ai-deep-session-live-regression.yml'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify stale evidence cannot block earned confession
        env:
          API_URL: https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai-interrogation-v1
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ya252dXdrbnZzZWRqZ3FjZndjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTY2MzcsImV4cCI6MjEwMTc3MjYzN30.68loNx8A71dodfOXXKs_-I235XVCmEioXGrg8kCZQr4
        run: |
          set -euo pipefail
          call_api() {
            local body="$1" out="$2"
            curl --fail --silent --show-error -o "$out" "$API_URL" \
              -H 'Origin: https://valera2872.github.io' \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "apikey: $ANON_KEY" \
              -H 'Content-Type: application/json' --data "$body"
          }

          Q='Антон и Орлов исключены подтвержденными алиби. Ваш телефон до 21:34 оставался внутри, хотя вы говорили про двор. В 21:31 фонд открыли вашей E-14 с вашим PIN, а точное окно камеры вы заранее выяснили у Антона. Вы взяли письмо?'
          H='[{"role":"user","text":"Где вы были после 21:25?"},{"role":"assistant","text":"Я уже ответила на этот вопрос."},{"role":"user","text":"Кому принадлежит E-14?"},{"role":"assistant","text":"Это моя служебная карта."},{"role":"user","text":"Почему телефон оставался внутри?"},{"role":"assistant","text":"Я не согласна с вашим выводом."},{"role":"user","text":"Вы знали время отключения камеры?"},{"role":"assistant","text":"Это ничего не доказывает."}]'

          shallow=$(jq -nc --arg q "$Q" --argjson h "$H" '{action:"interrogate",session_id:"shallow-gate-test-140001",visitor_id:"shallow-gate-visitor-140001",suspect_id:"marina",question:$q,evidence_id:"",history:$h,discovered_evidence_ids:["E01","E02","E03"],discovered_note_ids:[],question_counts:{marina:0,anton:0,lev:0}}')
          call_api "$shallow" /tmp/shallow.json
          ! grep -Fq 'N-MARINA-CONFESSION' /tmp/shallow.json
          ! jq -r '.reply' /tmp/shallow.json | grep -Eiq 'я (взяла|украла|похитила) письмо|письмо взяла я'

          deep=$(jq -nc --arg q "$Q" --argjson h "$H" '{action:"interrogate",session_id:"deep-gate-test-140001",visitor_id:"deep-gate-visitor-140001",suspect_id:"marina",question:$q,evidence_id:"",history:$h,discovered_evidence_ids:["E01","E02","E03"],discovered_note_ids:[],question_counts:{marina:0,anton:0,lev:0}}')
          call_api "$deep" /tmp/deep.json
          grep -Fq 'N-MARINA-CONFESSION' /tmp/deep.json
          jq -e '.interrogation_stage == "confessed"' /tmp/deep.json
          jq -r '.reply' /tmp/deep.json | grep -Eiq 'я (взяла|украла|похитила) письмо|письмо взяла я'
          cat /tmp/deep.json
