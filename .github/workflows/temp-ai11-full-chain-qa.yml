name: TEMP AI-11 full chain QA

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ai11-full-chain-qa.yml'

permissions:
  contents: read

jobs:
  full-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Phase 1 — recover independent earliest accounts
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body -sS 'https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai11-full-chain-qa-probe?probe=ai11-full-chain-once')"
          QA_JSON="$body" node <<'NODE'
          const d=JSON.parse(process.env.QA_JSON||'{}');
          if(!d.ok||d.phase!=='phase1') throw new Error(`phase1_failed:${JSON.stringify(d)}`);
          if(!Array.isArray(d.report)||d.report.length!==6||d.usage?.model_turns!==6) throw new Error(`phase1_contract_failed:${JSON.stringify(d)}`);
          for(const r of d.report) console.log('STEP',r.step,'MODE',r.mode,'STAGE',r.stage,'E+',r.new_evidence_count,'N+',r.new_note_count);
          if(d.state?.successful_turns!==6||d.state?.evidence_count!==6||d.state?.notes_count!==3) throw new Error(`phase1_state_failed:${JSON.stringify(d.state)}`);
          console.log('PHASE1_USAGE',JSON.stringify(d.usage));
          NODE
      - name: Respect production session RPM window
        run: sleep 65
      - name: Phase 2 — source contamination, independent access and terminal
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body -sS 'https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai11-full-chain-qa-probe?probe=ai11-full-chain-once')"
          QA_JSON="$body" node <<'NODE'
          const d=JSON.parse(process.env.QA_JSON||'{}');
          if(!d.ok||d.phase!=='complete') throw new Error(`phase2_failed:${JSON.stringify(d)}`);
          if(!Array.isArray(d.report)||d.report.length!==6||d.usage?.model_turns!==5) throw new Error(`phase2_contract_failed:${JSON.stringify(d)}`);
          for(const r of d.report) console.log('STEP',r.step,'MODE',r.mode,'STAGE',r.stage,'E+',r.new_evidence_count,'N+',r.new_note_count);
          const s11=d.report.find(r=>r.step===11),s12=d.report.find(r=>r.step===12);
          if(s11?.mode!=='ai'||s11?.stage!=='cornered') throw new Error(`corner_failed:${JSON.stringify(s11)}`);
          if(s12?.mode!=='canonical_confession'||s12?.stage!=='confessed') throw new Error(`terminal_failed:${JSON.stringify(s12)}`);
          if(d.state?.successful_turns!==12||d.state?.evidence_count!==10||d.state?.notes_count!==7||d.state?.confessed_count!==1||d.theory_correct!==true) throw new Error(`final_failed:${JSON.stringify({state:d.state,theory:d.theory_correct})}`);
          console.log('PHASE2_USAGE',JSON.stringify(d.usage));
          console.log('AI11_FULL_CHAIN_QA_OK');
          NODE
