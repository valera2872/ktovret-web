name: Patch AI final gate

on:
  push:
    branches: [fix/ai-final-gate-no-hidden-flags]
    paths:
      - 'tools/patch-ai-final-gate.mjs'
      - '.github/workflows/patch-ai-final-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-final-gate-no-hidden-flags
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch gate and tests
        run: node tools/patch-ai-final-gate.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/ai-interrogation-v1/index.ts tests/ai-detective-vslice-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Remove hidden-note dependency from AI confession gate'
          git push origin HEAD:fix/ai-final-gate-no-hidden-flags
