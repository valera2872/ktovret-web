name: Real case Moreno vertical slice

on:
  pull_request:
    branches: [main]
    paths:
      - 'realnye-dela/pozharnaya-lestnica-1991/**'
      - 'realnye-dela/pozharnaya-lestnica-1991-premium/**'
      - 'assets/real-case-moreno-*'
      - 'tools/real-case-moreno-*.mjs'
      - '.github/workflows/real-case-moreno.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check assets/real-case-moreno-budget-v51.js
          node --check assets/real-case-moreno-ai-v6.js
          node --check tools/real-case-moreno-v6-smoke.mjs
          node --check tools/real-case-moreno-v6-visual.mjs
          node --check tools/real-case-moreno-v9-premium-visual.mjs
      - name: Verify and capture premium v0.9 composition
        run: node tools/real-case-moreno-v9-premium-visual.mjs
      - name: Upload premium v0.9 audit
        uses: actions/upload-artifact@v4
        with:
          name: real-case-moreno-v9-audit
          path: artifacts/real-case-moreno-v9
          retention-days: 7
      - name: Regress v0.6 against real player transcript
        run: node tools/real-case-moreno-v6-smoke.mjs
      - name: Capture v0.6 visual audit
        if: always()
        run: node tools/real-case-moreno-v6-visual.mjs
      - name: Upload slice audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-case-moreno-v6-audit
          path: artifacts/real-case-moreno-v6
          retention-days: 7
