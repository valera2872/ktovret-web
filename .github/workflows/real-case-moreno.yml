name: Real case Moreno vertical slice

on:
  pull_request:
    branches: [main]
    paths:
      - 'realnye-dela/pozharnaya-lestnica-1991/**'
      - 'assets/real-case-moreno-*'
      - 'tools/real-case-moreno-*.mjs'
      - '.github/workflows/real-case-moreno.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check assets/real-case-moreno-budget-v51.js
          node --check assets/real-case-moreno-ai-v5.js
          node --check tools/real-case-moreno-v51-budget-smoke.mjs
          node --check tools/real-case-moreno-v5-visual.mjs
      - name: Validate hard AI budget and natural-language context
        run: node tools/real-case-moreno-v51-budget-smoke.mjs
      - name: Capture v0.5.1 visual audit
        run: node tools/real-case-moreno-v5-visual.mjs
      - name: Upload slice audit
        uses: actions/upload-artifact@v4
        with:
          name: real-case-moreno-v51-audit
          path: artifacts/real-case-moreno-v5
          retention-days: 7
