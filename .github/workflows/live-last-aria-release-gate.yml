name: Live Last Aria Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-room-gate:
    if: github.head_ref == 'audit/last-aria-full-release-gate-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live paid-room and abuse flow
        run: node tools/live-last-aria-release-gate.mjs
