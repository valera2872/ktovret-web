name: Validate Solo Engine 2.0 server runtime

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/solo-engine-v2-runtime.ts'
      - 'supabase/functions/_shared/solo-engine-v2-runtime.test.ts'
      - 'supabase/functions/_shared/solo-engine-v2-view.ts'
      - 'supabase/functions/_shared/solo-engine-v2-controller.ts'
      - 'supabase/functions/_shared/solo-engine-v2-controller.test.ts'
      - 'supabase/functions/solo-session-v2/**'
      - 'supabase/functions/solo-preview-auth/**'
      - 'assets/solo-v2-preview-auth.mjs'
      - 'admin/solo-v2-live-preview/**'
      - 'supabase/migrations/*solo_engine_v2*.sql'
      - '.github/workflows/solo-engine-v2-server.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/solo-engine-v2-runtime.ts'
      - 'supabase/functions/_shared/solo-engine-v2-runtime.test.ts'
      - 'supabase/functions/_shared/solo-engine-v2-view.ts'
      - 'supabase/functions/_shared/solo-engine-v2-controller.ts'
      - 'supabase/functions/_shared/solo-engine-v2-controller.test.ts'
      - 'supabase/functions/solo-session-v2/**'
      - 'supabase/functions/solo-preview-auth/**'
      - 'assets/solo-v2-preview-auth.mjs'
      - 'admin/solo-v2-live-preview/**'
      - 'supabase/migrations/*solo_engine_v2*.sql'
      - '.github/workflows/solo-engine-v2-server.yml'

permissions:
  contents: read

jobs:
  solo-engine-v2-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check shared runtime
        run: |
          deno check supabase/functions/_shared/solo-engine-v2-runtime.ts
          deno check supabase/functions/_shared/solo-engine-v2-view.ts
          deno check supabase/functions/_shared/solo-engine-v2-controller.ts
      - name: Check Edge Functions
        run: |
          deno check supabase/functions/solo-session-v2/index.ts
          deno check supabase/functions/solo-preview-auth/index.ts
      - name: Check preview bootstrap syntax
        run: node --check assets/solo-v2-preview-auth.mjs
      - name: Run server privacy and entitlement contract
        run: |
          deno test supabase/functions/_shared/solo-engine-v2-runtime.test.ts
          deno test supabase/functions/_shared/solo-engine-v2-controller.test.ts
      - name: Assert endpoint uses strict client view
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/functions/solo-session-v2/index.ts'
          grep -q "safeSoloClientPayload" "$file"
          ! grep -q "safeSoloPayload(runtime" "$file"
      - name: Validate scoped preview gate
        shell: bash
        run: |
          set -euo pipefail
          html='admin/solo-v2-live-preview/index.html'
          bootstrap='assets/solo-v2-preview-auth.mjs'
          auth='supabase/functions/solo-preview-auth/index.ts'
          grep -q 'noindex,nofollow,noarchive' "$html"
          grep -q 'MLPREVIEW-' "$html"
          grep -q 'solo-v2-preview-auth.mjs' "$html"
          ! grep -q 'MLADM-' "$html"
          grep -q 'solo-preview-auth' "$bootstrap"
          grep -q "metadata.source === 'internal_preview'" "$auth"
          grep -q "metadata.solo_access_mode === 'owned'" "$auth"
          grep -q 'allowedCases.length === 1' "$auth"
          ! grep -R -q 'ML0512_PREVIEW_' "$html" "$bootstrap"
      - name: Validate migration security contract
        shell: bash
        run: |
          set -euo pipefail
          base='supabase/migrations/20260907014500_solo_engine_v2_server_state.sql'
          index='supabase/migrations/20260907083020_solo_engine_v2_entitlement_index.sql'
          grep -q 'enable row level security' "$base"
          grep -q 'revoke all on table public.solo_case_definitions from public, anon, authenticated' "$base"
          grep -q 'revoke all on table public.solo_case_sessions from public, anon, authenticated' "$base"
          grep -q 'on delete set null' "$base"
          grep -q 'PRIVATE_CANON_PRODUCTION' "$base"
          grep -q 'production_eligible' "$base"
          grep -q 'solo_case_sessions_entitlement_idx' "$index"
          grep -q 'on public.solo_case_sessions (entitlement_id)' "$index"
