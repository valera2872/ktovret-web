name: Validate and deploy Mystery Logic web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

env:
  KTOVRET_SOURCE_COMMIT: 51c178f4dceba7bdb859e1e5d0c3244150438c0d
  KTOVRET_SOURCE_TOKEN: ${{ secrets.KTOVRET_SOURCE_TOKEN }}

concurrency:
  group: pages-${{ github.event_name == 'issue_comment' && github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.body == '/deploy-ktovret-web' || github.event.comment.body == '/validate-ktovret-web'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'issue_comment' && github.event.comment.body == '/validate-ktovret-web' && format('refs/pull/{0}/head', github.event.issue.number)) || 'main' }}
          path: web

      - name: Checkout private mobile content
        if: env.KTOVRET_SOURCE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: valera2872/ktovret
          ref: ${{ env.KTOVRET_SOURCE_COMMIT }}
          path: mobile-source
          persist-credentials: false
          token: ${{ env.KTOVRET_SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit source library 100 / 15 / 85
        if: env.KTOVRET_SOURCE_TOKEN != ''
        working-directory: web
        run: node tools/import-mobile/audit-library.mjs --source ../mobile-source --out ../qa-report.json --commit "$KTOVRET_SOURCE_COMMIT"

      - name: Generate public 15/85 library from private source
        if: env.KTOVRET_SOURCE_TOKEN != ''
        working-directory: web
        run: node tools/import-mobile-cases.mjs --source ../mobile-source --site . --mode public --commit "$KTOVRET_SOURCE_COMMIT"

      - name: Validate JavaScript
        working-directory: web
        run: |
          node --check ktovret-game/assets/app.js
          node --check ktovret-game/assets/app-core.js
          node --check ktovret-game/assets/dossier-nav.js
          node --check ktovret-game/assets/performance.js
          node --check ktovret-game/assets/duel-room-client.js
          node --check assets/case-adapter.js
          node --check assets/mobile-scroll-stabilizer.js
          node --check assets/dossier-model.js
          node --check assets/dossier-progress.js
          node --check assets/dossier-achievements.js
          node --check assets/full-catalog.js
          node --check assets/catalog-experience.js
          node --check assets/analytics-events.js
          node --check assets/duel-room.js
          node --check assets/case-407-solo.js
          node --check assets/logic-expert.js
          node --check tools/import-mobile-cases.mjs
          node --check tools/preview-editorial.mjs
          node --check tools/responsive-smoke.mjs
          node --check tools/import-mobile/common.mjs
          node --check tools/import-mobile/audit-library.mjs
          node --check tools/import-mobile/validate-editorial-build.mjs
          node --check tools/import-mobile/seo-policy.mjs
          node --check tools/import-mobile/collection-pages.mjs
          node --check tools/import-mobile/seo-native-postprocess.mjs
          node --check tools/import-mobile/seo-wordstat-expansion.mjs
          node --check tools/import-mobile/two-player-room-postprocess.mjs
          node --check tools/import-mobile/solo-407-postprocess.mjs
          node --check tools/import-mobile/logic-expert-release-data.mjs
          node --check tools/import-mobile/logic-expert-seo-postprocess.mjs
          node --check tools/import-mobile/site-config.mjs
          node --check tools/import-mobile/site-origin-postprocess.mjs
          test ! -f tools/import-mobile/load.mjs || node --check tools/import-mobile/load.mjs
          test ! -f tools/import-mobile/load-active.mjs || node --check tools/import-mobile/load-active.mjs
          node --check tools/import-mobile/case-pages.mjs
          node --check tools/import-mobile/catalog.mjs
          node --check tools/import-mobile/witness-postprocess.mjs
          test ! -f tools/import-mobile/seo-pages.mjs || node --check tools/import-mobile/seo-pages.mjs

      - name: Test committed/generated public library
        working-directory: web
        run: |
          node tests/dossier-model.test.js
          node tests/catalog-experience.test.js
          node tests/seo-native-cases.test.js

      - name: Validate public boundaries
        working-directory: web
        run: |
          test "$(find delo -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 100
          test "$(grep -rl 'window.KtoVretWeb=' delo/*/index.html | wc -l)" -eq 15
          test "$(grep -rlE 'Материалы(, показания)? и решение не загружаются' delo/*/index.html | wc -l)" -eq 85
          test "$(find ru/cases -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 100
          test "$(grep -rl 'data-seo-prerender' ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'data-premium-seo-teaser' ru/cases/*/index.html | wc -l)" -eq 85
          test "$(grep -rl 'data-seo-collection-link' ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -l 'data-premium-seo-teaser' ru/cases/*/index.html | xargs grep -l 'window.KtoVretWeb=' | wc -l)" -eq 0
          test -f ru/besplatnye-detektivnye-dela/index.html
          grep -q '15 бесплатных детективных дел онлайн' ru/besplatnye-detektivnye-dela/index.html
          grep -q 'CollectionPage' ru/besplatnye-detektivnye-dela/index.html
          grep -q 'ItemList' ru/besplatnye-detektivnye-dela/index.html
          test -f golovolomki-onlayn/index.html
          test -f zagadki-na-logiku-dlya-vzroslyh/index.html
          test -f detektivnye-igry-dlya-dvoih/index.html
          test -f detektivnye-igry-dlya-odnogo/index.html
          test -f detektivnye-igry-dlya-odnogo/407/index.html
          grep -q '<meta name="robots" content="noindex,follow">' detektivnye-igry-dlya-odnogo/407/index.html
          grep -q '"totalCases": 100' assets/generated/import-report.json
          grep -q '"freeCases": 15' assets/generated/import-report.json
          grep -q '"premiumCases": 85' assets/generated/import-report.json
          grep -q '"seoNativeCases": 15' assets/generated/import-report.json
          grep -q '"indexableCollections": 1' assets/generated/import-report.json
          grep -q '"collectionPages": 1' assets/generated/import-report.json
          grep -q '"seoCasePages": 100' assets/generated/import-report.json
          grep -q '"premiumSeoTeaserPages": 85' assets/generated/import-report.json
          grep -q '"wordstatHubPages": 3' assets/generated/import-report.json
          grep -q '"twoPlayerRoomPage": "detektivnye-igry-dlya-dvoih"' assets/generated/import-report.json
          grep -q '"twoPlayerRoomFreeCases": 15' assets/generated/import-report.json
          grep -q '"soloHubPage": "detektivnye-igry-dlya-odnogo"' assets/generated/import-report.json
          grep -q '"soloCaseRoute": "detektivnye-igry-dlya-odnogo/407"' assets/generated/import-report.json
          grep -q '"soloMaterials": 18' assets/generated/import-report.json
          grep -q '"indexableUrls": 134' assets/generated/import-report.json
          grep -q '"logicHubPuzzles": 20' assets/generated/import-report.json
          grep -q '"logicHubPages": 23' assets/generated/import-report.json
          grep -q '"logicHubVersion": "2.0.0"' assets/generated/import-report.json
          grep -q '"logicExpertMainHub": "golovolomki-onlayn/"' assets/generated/import-report.json
          grep -q '"logicExpertAdultHub": "zagadki-na-logiku-dlya-vzroslyh/"' assets/generated/import-report.json
          test "$(grep -rl 'duel-room-client.js' ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -l 'duel-room-client.js' ru/cases/*/index.html | xargs grep -l 'data-premium-seo-teaser' | wc -l)" -eq 0
          if test -f assets/premium.css; then
            test "$(grep -rl 'noindex,follow' delo/*/index.html | wc -l)" -eq 100
            test -f detektivnye-igry-onlayn/index.html
            test -f detektivnye-zagadki-s-otvetami/index.html
            test -f logicheskie-detektivnye-zadachi/index.html
            test -f kto-vret-igra/index.html
            test -f tom-1/index.html
            test -f logicheskie-zadachi/index.html
            test "$(find logicheskie-zadachi -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 20
            test -f logicheskie-zadachi/protokol-shesti-cifr/index.html
            test -f logicheskie-zadachi/domino-razbienie-4x5/index.html
            test ! -d logicheskie-zadachi/shest-pokazaniy
            test ! -d logicheskie-zadachi/arhivnaya-matrica-5x5
            test "$(grep -o 'class=\"case-card\"' dela/index.html | wc -l)" -eq 15
            test "$(grep -o 'data-access=\"premium\"' dela/index.html | wc -l)" -eq 0
            grep -q 'Открыть 85 дел за 99 ₽' tom-1/index.html
            grep -q '"indexableUrls": 134' assets/generated/import-report.json
            test "$(grep -c '<url>' sitemap.xml)" -eq 134
            test "$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sort -u | wc -l)" -eq 134
            grep -q 'BreadcrumbList' detektivnye-igry-onlayn/index.html
            grep -q '<loc>https://valera2872.github.io/ktovret-web/ru/besplatnye-detektivnye-dela/</loc>' sitemap.xml
            grep -q '<loc>https://valera2872.github.io/ktovret-web/golovolomki-onlayn/</loc>' sitemap.xml
            grep -q '<loc>https://valera2872.github.io/ktovret-web/zagadki-na-logiku-dlya-vzroslyh/</loc>' sitemap.xml
            grep -q '<loc>https://valera2872.github.io/ktovret-web/detektivnye-igry-dlya-dvoih/</loc>' sitemap.xml
            grep -q '<loc>https://valera2872.github.io/ktovret-web/detektivnye-igry-dlya-odnogo/</loc>' sitemap.xml
            grep -q '<loc>https://valera2872.github.io/ktovret-web/logicheskie-zadachi/</loc>' sitemap.xml
            grep -q '<loc>https://valera2872.github.io/ktovret-web/logicheskie-zadachi/protokol-shesti-cifr/</loc>' sitemap.xml
            grep -q '<loc>https://valera2872.github.io/ktovret-web/logicheskie-zadachi/domino-razbienie-4x5/</loc>' sitemap.xml
            test "$(grep -o 'https://valera2872.github.io/ktovret-web/logicheskie-zadachi/[^<]*/' sitemap.xml | wc -l)" -eq 20
            ! grep -q '<loc>https://valera2872.github.io/ktovret-web/logicheskie-zadachi/shest-pokazaniy/</loc>' sitemap.xml
            ! grep -q '<loc>https://valera2872.github.io/ktovret-web/logicheskie-zadachi/arhivnaya-matrica-5x5/</loc>' sitemap.xml
            ! grep -q '<loc>https://valera2872.github.io/ktovret-web/detektivnye-igry-dlya-odnogo/407/</loc>' sitemap.xml
          fi

      - name: Render SEO-native case in mobile and desktop Chrome
        working-directory: web
        run: node tools/responsive-smoke.mjs

      - name: Upload responsive smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: seo-native-responsive-smoke
          path: web/artifacts/responsive-smoke
          retention-days: 7

      - name: Validate editorial 100-case conversion
        if: env.KTOVRET_SOURCE_TOKEN != ''
        run: |
          cp -a web editorial
          node editorial/tools/import-mobile-cases.mjs --source mobile-source --site editorial --mode editorial --commit "$KTOVRET_SOURCE_COMMIT"
          node editorial/tools/import-mobile/validate-editorial-build.mjs --site editorial
          test "$(grep -rl 'window.KtoVretWeb=' editorial/delo/*/index.html | wc -l)" -eq 100
          test "$(grep -rlE 'Материалы(, показания)? и решение не загружаются' editorial/delo/*/index.html | wc -l)" -eq 0
          test "$(grep -rl 'data-seo-prerender' editorial/ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'data-premium-seo-teaser' editorial/ru/cases/*/index.html | wc -l)" -eq 85
          test -f editorial/ru/besplatnye-detektivnye-dela/index.html
          test -f editorial/detektivnye-igry-dlya-odnogo/index.html
          test -f editorial/detektivnye-igry-dlya-odnogo/407/index.html
          test -f editorial/logicheskie-zadachi/index.html
          test "$(find editorial/logicheskie-zadachi -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 20
          test -f editorial/logicheskie-zadachi/protokol-shesti-cifr/index.html
          rm -rf editorial

      - name: Validate PHP and sitemap
        working-directory: web
        run: |
          php -l ktovret-game/ktovret-game.php
          python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"

      - name: Verify stable game isolation
        working-directory: web
        run: |
          ! grep -q 'performance.js?v=' ktovret-game/assets/app.js
          test -f assets/generated/cases-index.json
          test -f assets/generated/cases-index.js
          test -f assets/duel-room.js
          test -f assets/case-407-solo.js
          test -f ktovret-game/assets/duel-room-client.js
          test -f tom-1/index.html
          test -f detektivnye-igry-dlya-odnogo/index.html
          test -f detektivnye-igry-dlya-odnogo/407/index.html
          test -f logicheskie-zadachi/index.html
          test -f logicheskie-zadachi/protokol-shesti-cifr/index.html
          test -f logicheskie-zadachi/domino-razbienie-4x5/index.html
          grep -q '"freeCases": 15' assets/generated/import-report.json
          grep -q '"premiumCases": 85' assets/generated/import-report.json
          grep -q '"indexableUrls": 134' assets/generated/import-report.json
          grep -q '"logicHubPuzzles": 20' assets/generated/import-report.json
          grep -q '"logicHubPages": 23' assets/generated/import-report.json
          test "$(grep -o 'class=\"case-card\"' dela/index.html | wc -l)" -eq 15
          test "$(grep -o 'data-access=\"premium\"' dela/index.html | wc -l)" -eq 0
          grep -q 'Открыть 85 дел за 99 ₽' tom-1/index.html

      - name: Report requested validation
        if: always() && github.event_name == 'issue_comment' && github.event.comment.body == '/validate-ktovret-web'
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Mystery Logic validation\n\n- Result: **${ok ? 'success' : 'failure'}**\n- Public boundary: **100 legacy / 15 playable / 85 locked**\n- SEO case routes: **100 indexable /ru/cases/ pages (15 playable + 85 spoiler-safe teasers)**\n- Wordstat hubs: **3 intent pages**\n- Expert logic: **20 expert puzzles / 23 logic routes**\n- Solo investigations: **1 indexable hub / Room 407 runtime noindex**\n- Sitemap: **134 unique indexable URLs**\n- Private source audit runs when repository secret KTOVRET_SOURCE_TOKEN is configured.`
            });

  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/deploy-ktovret-web')
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          ref: main
          path: web

      - name: Checkout private mobile content
        if: env.KTOVRET_SOURCE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: valera2872/ktovret
          ref: ${{ env.KTOVRET_SOURCE_COMMIT }}
          path: mobile-source
          persist-credentials: false
          token: ${{ env.KTOVRET_SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate public library from private source
        if: env.KTOVRET_SOURCE_TOKEN != ''
        working-directory: web
        run: node tools/import-mobile-cases.mjs --source ../mobile-source --site . --mode public --commit "$KTOVRET_SOURCE_COMMIT"

      - name: Remove development-only files
        run: rm -rf web/.git web/.github web/tools web/tests web/artifacts web/preview-all-100.cmd

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
