name: Deploy web MVP to GitHub Pages

on:
  push:
    branches: [main]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check ktovret-game/assets/app.js
      - name: Validate PHP syntax
        run: php -l ktovret-game/ktovret-game.php
      - name: Verify required files
        run: test -f index.html && test -f ktovret-game/assets/style.css

  deploy:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
