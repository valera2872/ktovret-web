name: Validate Mystery Logic web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KTOVRET_SOURCE_COMMIT: a2ad0f80e70beeb91d478f0bcf98d0ea31cc05dd
  KTOVRET_SOURCE_TOKEN: ${{ secrets.KTOVRET_SOURCE_TOKEN }}

concurrency:
  group: mysterylogic-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require private source token
        run: test -n "$KTOVRET_SOURCE_TOKEN" || (echo "KTOVRET_SOURCE_TOKEN is required" && exit 1)

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: web

      - name: Checkout private mobile content
        uses: actions/checkout@v4
        with:
          repository: valera2872/ktovret
          ref: ${{ env.KTOVRET_SOURCE_COMMIT }}
          path: mobile-source
          persist-credentials: false
          token: ${{ env.KTOVRET_SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate current public site
        working-directory: web
        run: node tools/import-mobile-cases.mjs --source ../mobile-source --site . --mode public --commit "$KTOVRET_SOURCE_COMMIT"

      - name: Validate JavaScript and release tools
        working-directory: web
        run: |
          set -euo pipefail
          node --check ktovret-game/assets/app.js
          node --check ktovret-game/assets/app-core.js
          node --check ktovret-game/assets/dossier-nav.js
          node --check assets/volume-storefront.js
          node --check assets/analytics-events.js
          node --check assets/duel-room.js
          node --check assets/case-407-solo.js
          node --check assets/solo-mini.js
          node --check assets/solo-investigations-checkout.js
          node --check assets/solo-investigations-player.js
          node --check assets/logic-expert.js
          node --check assets/logic-audience.js
          node --check tools/import-mobile-cases.mjs
          node --check tools/import-mobile/solo-mini-postprocess.mjs
          node --check tools/import-mobile/solo-paid-investigations-postprocess.mjs
          node --check tools/import-mobile/solo-hub-kto-vret-polish.mjs
          node --check tools/puzzle-editorial-release-validate.mjs
          node --check tools/solo-mini-validate.mjs
          node --check tools/solo-paid-investigations-validate.mjs

      - name: Validate restored Who Lied catalog
        working-directory: web
        run: |
          set -euo pipefail
          test "$(find delo -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 100
          test "$(grep -rl 'window.KtoVretWeb=' delo/*/index.html | wc -l)" -eq 15
          test "$(grep -rlE 'Материалы(, показания)? и решение не загружаются' delo/*/index.html | wc -l)" -eq 85
          test "$(find ru/cases -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 100
          test "$(grep -rl 'data-seo-prerender' ru/cases/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'data-premium-seo-teaser' ru/cases/*/index.html | wc -l)" -eq 85
          test "$(grep -l 'data-premium-seo-teaser' ru/cases/*/index.html | xargs grep -l 'window.KtoVretWeb=' | wc -l)" -eq 0
          grep -q '"totalCases": 100' assets/generated/import-report.json
          grep -q '"freeCases": 15' assets/generated/import-report.json
          grep -q '"premiumCases": 85' assets/generated/import-report.json
          grep -q '"volume1Cases": 85' assets/generated/import-report.json
          grep -q '"volume2Cases": 0' assets/generated/import-report.json
          grep -q '"seoNativeCases": 15' assets/generated/import-report.json
          grep -q '"seoCasePages": 100' assets/generated/import-report.json
          grep -q '"premiumSeoTeaserPages": 85' assets/generated/import-report.json
          grep -q '15 бесплат' index.html
          grep -q '199 ₽' tom-1/index.html
          grep -q '85' tom-1/index.html
          ! grep -q 'Том II' tom-1/index.html
          ! grep -q 'data-volume-card="volume2"' tom-1/index.html
          ! grep -q 'data-volume-card="volume_bundle_1_2"' tom-1/index.html

      - name: Validate Solo product ladder
        working-directory: web
        run: |
          set -euo pipefail
          test -f detektivnye-igry-dlya-odnogo/index.html
          test -f detektivnye-igry-dlya-odnogo/407/index.html
          test -f detektivnye-igry-dlya-odnogo/mini/index.html
          test -f detektivnye-igry-dlya-odnogo/rassledovaniya/index.html
          grep -q 'data-solo-mini-bridge' detektivnye-igry-dlya-odnogo/index.html
          grep -q 'data-solo-paid-bridge' detektivnye-igry-dlya-odnogo/index.html
          grep -q 'Играть в 15 дел бесплатно' detektivnye-igry-dlya-odnogo/index.html
          grep -q '85 дел открываются одним полным архивом за 199 ₽' detektivnye-igry-dlya-odnogo/index.html
          grep -q 'Открыть Том I за 99 ₽' detektivnye-igry-dlya-odnogo/rassledovaniya/index.html
          node tools/solo-mini-validate.mjs
          node tools/solo-paid-investigations-validate.mjs

      - name: Validate SEO and preserved verticals
        working-directory: web
        run: |
          set -euo pipefail
          node tests/seo-native-cases.test.js
          node tests/puzzle-editorial-contract.mjs
          node tools/puzzle-editorial-release-validate.mjs --site .
          test -f detektivnye-igry-dlya-dvoih/index.html
          test -f detektivnye-igry-dlya-dvoih/poslednyaya-ariya/index.html
          test -f golovolomki-onlayn/index.html
          test -f zagadki-na-logiku-dlya-vzroslyh/index.html
          test -f logicheskie-zadachi/index.html
          test "$(find logicheskie-zadachi -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 20
          report_urls="$(node -p "require('./assets/generated/import-report.json').indexableUrls")"
          sitemap_urls="$(grep -c '<url>' sitemap.xml)"
          test "$report_urls" -eq "$sitemap_urls"

      - name: Responsive smoke
        working-directory: web
        run: node tools/responsive-smoke.mjs

      - name: Upload validation screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mysterylogic-responsive-smoke
          path: web/artifacts/responsive-smoke
          retention-days: 7
          if-no-files-found: error
