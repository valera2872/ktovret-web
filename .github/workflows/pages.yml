name: Validate and deploy Mystery Logic web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

env:
  KTOVRET_SOURCE_COMMIT: 51c178f4dceba7bdb859e1e5d0c3244150438c0d

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/deploy-ktovret-web')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          path: web
      - name: Checkout mobile content
        uses: actions/checkout@v4
        with:
          repository: valera2872/ktovret
          ref: ${{ env.KTOVRET_SOURCE_COMMIT }}
          path: mobile-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate public 15/85 library
        working-directory: web
        run: node tools/import-mobile-cases.mjs --source ../mobile-source --site . --mode public --commit "$KTOVRET_SOURCE_COMMIT"
      - name: Validate JavaScript
        working-directory: web
        run: |
          node --check ktovret-game/assets/app.js
          node --check ktovret-game/assets/app-core.js
          node --check ktovret-game/assets/dossier-nav.js
          node --check ktovret-game/assets/performance.js
          node --check assets/case-adapter.js
          node --check assets/dossier-model.js
          node --check assets/dossier-progress.js
          node --check assets/dossier-achievements.js
          node --check assets/full-catalog.js
          node --check tools/import-mobile-cases.mjs
          node --check tools/import-mobile/common.mjs
          node --check tools/import-mobile/load.mjs
          node --check tools/import-mobile/case-pages.mjs
          node --check tools/import-mobile/catalog.mjs
      - name: Test generated 100-case library
        working-directory: web
        run: node tests/dossier-model.test.js
      - name: Validate public boundaries
        working-directory: web
        run: |
          test "$(find delo -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 100
          test "$(grep -rl 'window.KtoVretWeb=' delo/*/index.html | wc -l)" -eq 15
          test "$(grep -rl 'Материалы и решение не загружаются' delo/*/index.html | wc -l)" -eq 85
          grep -q '"totalCases": 100' assets/generated/import-report.json
          grep -q '"freeCases": 15' assets/generated/import-report.json
          grep -q '"premiumCases": 85' assets/generated/import-report.json
      - name: Validate editorial 100-case conversion
        run: |
          cp -a web editorial
          node editorial/tools/import-mobile-cases.mjs --source mobile-source --site editorial --mode editorial --commit "$KTOVRET_SOURCE_COMMIT"
          test "$(grep -rl 'window.KtoVretWeb=' editorial/delo/*/index.html | wc -l)" -eq 100
          test "$(grep -rl 'Материалы и решение не загружаются' editorial/delo/*/index.html | wc -l)" -eq 0
          rm -rf editorial
      - name: Validate PHP and sitemap
        working-directory: web
        run: |
          php -l ktovret-game/ktovret-game.php
          python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
      - name: Verify stable game isolation
        working-directory: web
        run: |
          ! grep -q 'performance.js?v=' ktovret-game/assets/app.js
          test -f assets/generated/cases-index.json
          test -f assets/generated/cases-index.js
          grep -q '100 расследований' dela/index.html
          grep -q '15 бесплатно' dela/index.html
          grep -q '85 в полном томе' dela/index.html

  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/deploy-ktovret-web')
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          ref: main
          path: web
      - name: Checkout mobile content
        uses: actions/checkout@v4
        with:
          repository: valera2872/ktovret
          ref: ${{ env.KTOVRET_SOURCE_COMMIT }}
          path: mobile-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate public 15/85 library
        working-directory: web
        run: node tools/import-mobile-cases.mjs --source ../mobile-source --site . --mode public --commit "$KTOVRET_SOURCE_COMMIT"
      - name: Remove development-only files
        run: rm -rf web/.git web/.github web/tools web/tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report deployment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Mystery Logic 0.9 deployment\n\n- Build: **success**\n- Import: **100 cases / 15 free / 85 locked**\n- Deploy: **success**\n- Page URL: ${process.env.PAGE_URL}`
            })
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
