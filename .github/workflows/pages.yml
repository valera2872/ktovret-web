name: Validate and deploy Mystery Logic web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/deploy-ktovret-web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check ktovret-game/assets/app.js
          node --check ktovret-game/assets/dossier-nav.js
          node --check assets/case-adapter.js
          node --check assets/dossier-model.js
          node --check assets/dossier-progress.js
      - name: Test dossier model
        run: node tests/dossier-model.test.js
      - name: Validate PHP syntax
        run: php -l ktovret-game/ktovret-game.php
      - name: Verify public routes and assets
        run: |
          test -f index.html
          test -f kto-vret/index.html
          test -f dela/index.html
          test -f delo/chetyre-vhoda-v-arhiv/index.html
          test -f delo/tri-nesinhronnyh-zhurnala/index.html
          test -f delo/pyat-papok-i-pustoe-mesto/index.html
          test -f delo/noutbuk-u-dvuh-vyhodov/index.html
          test -f delo/karta-telefon-i-vosem-minut/index.html
          test -f delo/zapis-do-vskrytiya-konteynera/index.html
          test -f assets/case-adapter.js
          test -f assets/dossier-model.js
          test -f assets/dossier-progress.js
          test -f assets/mysterylogic.css
          test -f assets/ml-mark.svg
          test -f ktovret-game/assets/dossier-nav.js
          test -f ktovret-game/assets/style.css
          test -f tests/dossier-model.test.js
          test -f robots.txt
          test -f sitemap.xml
          test -f 404.html
      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
      - name: Verify catalog links and profile integration
        run: |
          grep -q 'chetyre-vhoda-v-arhiv' dela/index.html
          grep -q 'tri-nesinhronnyh-zhurnala' dela/index.html
          grep -q 'pyat-papok-i-pustoe-mesto' dela/index.html
          grep -q 'noutbuk-u-dvuh-vyhodov' dela/index.html
          grep -q 'karta-telefon-i-vosem-minut' dela/index.html
          grep -q 'dossier-progress.js' dela/index.html
          grep -q 'dossier-progress.js' kto-vret/index.html
          grep -q 'dossier-model.js?v=0.6.0' ktovret-game/assets/app.js
          grep -q 'dossier-model.js?v=0.6.0' assets/dossier-progress.js
          grep -q 'dossier-nav.js' ktovret-game/assets/app.js
          grep -q 'first_r3_002_unsynced_logs' assets/dossier-model.js
          grep -q 'first_r3_003_five_folders_gap' assets/dossier-model.js
          grep -q 'first_r3_005_card_phone_route' assets/dossier-model.js

  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/deploy-ktovret-web')
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report deployment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Mystery Logic deployment\n\n- Build: **success**\n- Deploy: **success**\n- Page URL: ${process.env.PAGE_URL}`
            })
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
