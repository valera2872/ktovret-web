name: Live smoke Mystery Logic Last Aria paid backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-last-aria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Live paid room boundary
        env:
          ENDPOINT: https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/coop-last-aria
        run: |
          node <<'NODE'
          const { randomBytes } = require('node:crypto');

          (async () => {
            const endpoint = process.env.ENDPOINT;
            const origin = 'https://mysterylogic.com';
            const browserKey = randomBytes(24).toString('hex');

            const options = await fetch(endpoint, {
              method: 'OPTIONS',
              headers: { origin, 'access-control-request-method': 'POST', 'access-control-request-headers': 'authorization, content-type' },
            });
            if (options.status !== 204) throw new Error(`OPTIONS: HTTP ${options.status}`);
            const allowedHeaders = String(options.headers.get('access-control-allow-headers') || '');
            if (!allowedHeaders.includes('authorization') || !allowedHeaders.includes('content-type')) {
              throw new Error(`OPTIONS missing paid auth headers: ${allowedHeaders}`);
            }

            const postCreate = async (authorization = '') => {
              const headers = { 'content-type': 'application/json', origin };
              if (authorization) headers.authorization = authorization;
              const response = await fetch(endpoint, {
                method: 'POST',
                headers,
                body: JSON.stringify({ action: 'create', browserKey, playerName: 'Paid boundary smoke' }),
              });
              const text = await response.text();
              let payload = {};
              try { payload = JSON.parse(text); } catch {}
              return { response, text, payload };
            };

            const anonymous = await postCreate();
            if (anonymous.response.status !== 402 || anonymous.payload.error !== 'payment_required') {
              throw new Error(`anonymous create must be 402 payment_required, got ${anonymous.response.status} ${anonymous.text}`);
            }

            const bogus = await postCreate(`Bearer ml_aria_${'A'.repeat(43)}`);
            if (bogus.response.status !== 402 || bogus.payload.error !== 'payment_required') {
              throw new Error(`bogus entitlement must be 402 payment_required, got ${bogus.response.status} ${bogus.text}`);
            }

            const forbiddenOrigin = await fetch(endpoint, {
              method: 'POST',
              headers: { 'content-type': 'application/json', origin: 'https://example.invalid' },
              body: JSON.stringify({ action: 'create', browserKey, playerName: 'Origin smoke' }),
            });
            if (forbiddenOrigin.status !== 403) throw new Error(`foreign origin must be 403, got ${forbiddenOrigin.status}`);

            console.log('coop-last-aria paid production boundary passed');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
