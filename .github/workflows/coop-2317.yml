name: Validate Mystery Logic 23:17 co-op case

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-2317:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate client and dossier syntax
        run: |
          node --check assets/case-2317-data.js
          node --check assets/case-2317.js
          node --check tools/import-mobile/two-player-2317-postprocess.mjs
      - name: Validate product boundary
        run: |
          grep -q "id: 'special:2317'" assets/case-2317-data.js
          grep -q "Последний звонок в 23:17" assets/case-2317-data.js
          grep -q "45–60 минут" assets/case-2317-data.js
          grep -q "CASE_ROUTE = 'detektivnye-igry-dlya-dvoih/2317'" tools/import-mobile/two-player-2317-postprocess.mjs
          grep -q 'meta name="robots" content="noindex,follow"' tools/import-mobile/two-player-2317-postprocess.mjs
          grep -q '<h1>Детективная игра для двоих онлайн</h1>' tools/import-mobile/two-player-2317-postprocess.mjs
          grep -q 'Короткая дуэль · 10–15 минут' tools/import-mobile/two-player-2317-postprocess.mjs
          grep -q "functions/v1/coop-2317" assets/case-2317.js
          grep -q "const CASE_ID = 'special:2317'" supabase/functions/coop-2317/index.ts
          ! grep -q "functions/v1/coop-2317" assets/duel-room.js
      - name: Live room contract smoke
        env:
          ENDPOINT: https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/coop-2317
        run: |
          set -euo pipefail
          K1="$(openssl rand -hex 24)"
          K2="$(openssl rand -hex 24)"
          post() {
            curl -fsS "$ENDPOINT" \
              -H 'content-type: application/json' \
              -H 'origin: https://mysterylogic.com' \
              --data "$1"
          }
          CREATED="$(post \"{\\\"action\\\":\\\"create\\\",\\\"browserKey\\\":\\\"$K1\\\",\\\"playerName\\\":\\\"CI Investigator\\\"}\")"
          CODE="$(printf '%s' "$CREATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.me.role!=='creator'||x.room.caseId!=='special:2317')process.exit(2);process.stdout.write(x.room.code)})")"
          PREVIEW="$(post \"{\\\"action\\\":\\\"preview\\\",\\\"browserKey\\\":\\\"$K2\\\",\\\"code\\\":\\\"$CODE\\\"}\")"
          printf '%s' "$PREVIEW" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.roomFull||!x.creatorName)process.exit(3)})"
          JOINED="$(post \"{\\\"action\\\":\\\"join\\\",\\\"browserKey\\\":\\\"$K2\\\",\\\"code\\\":\\\"$CODE\\\",\\\"playerName\\\":\\\"CI Analyst\\\"}\")"
          printf '%s' "$JOINED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.bothJoined||x.me.role!=='guest')process.exit(4)})"
          post "{\"action\":\"start\",\"browserKey\":\"$K1\",\"code\":\"$CODE\"}" >/dev/null
          post "{\"action\":\"start\",\"browserKey\":\"$K2\",\"code\":\"$CODE\"}" >/dev/null
          FIRST="$(post \"{\\\"action\\\":\\\"complete\\\",\\\"browserKey\\\":\\\"$K1\\\",\\\"code\\\":\\\"$CODE\\\",\\\"elapsedSeconds\\\":120,\\\"hintsUsed\\\":1,\\\"attempts\\\":1,\\\"firstAnswerCorrect\\\":true}\")"
          printf '%s' "$FIRST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.bothCompleted)process.exit(5)})"
          SECOND="$(post \"{\\\"action\\\":\\\"complete\\\",\\\"browserKey\\\":\\\"$K2\\\",\\\"code\\\":\\\"$CODE\\\",\\\"elapsedSeconds\\\":140,\\\"hintsUsed\\\":0,\\\"attempts\\\":2,\\\"firstAnswerCorrect\\\":false}\")"
          printf '%s' "$SECOND" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.bothCompleted||x.results.creator.name!=='CI Investigator'||x.results.guest.name!=='CI Analyst')process.exit(6)})"
