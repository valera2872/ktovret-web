name: Validate premium logic hub

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/logic-hub.*'
      - 'assets/logic-expert.*'
      - 'assets/logic-sitewide.*'
      - 'tools/logic-expert-review-v2-validate.mjs'
      - 'tools/logic-expert-review-v2-extension-validate.mjs'
      - 'tools/import-mobile/logic-expert-release-data.mjs'
      - 'tools/import-mobile/logic-expert-seo-postprocess.mjs'
      - 'tools/import-mobile/logic-sitewide-postprocess.mjs'
      - 'tools/import-mobile-cases.mjs'
      - '.github/workflows/logic-hub.yml'
  push:
    branches: [main]
    paths:
      - 'assets/logic-hub.*'
      - 'assets/logic-expert.*'
      - 'assets/logic-sitewide.*'
      - 'tools/logic-expert-review-v2-validate.mjs'
      - 'tools/logic-expert-review-v2-extension-validate.mjs'
      - 'tools/import-mobile/logic-expert-release-data.mjs'
      - 'tools/import-mobile/logic-expert-seo-postprocess.mjs'
      - 'tools/import-mobile/logic-sitewide-postprocess.mjs'
      - 'tools/import-mobile-cases.mjs'
      - '.github/workflows/logic-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check assets/logic-expert.js
          node --check assets/logic-sitewide.js
          node --check tools/import-mobile/logic-expert-release-data.mjs
          node --check tools/import-mobile/logic-expert-seo-postprocess.mjs
          node --check tools/import-mobile/logic-sitewide-postprocess.mjs
          node --check tools/import-mobile-cases.mjs
          node --check tools/logic-expert-review-v2-validate.mjs
          node --check tools/logic-expert-review-v2-extension-validate.mjs
      - name: Validate Expert corpus 001-012
        run: node tools/logic-expert-review-v2-validate.mjs
      - name: Validate Expert corpus 013-020
        run: node tools/logic-expert-review-v2-extension-validate.mjs
