name: AI case manifest security

on:
  pull_request:
    paths:
      - 'content/ai-cases/**'
      - 'docs/ai-case-authoring-security.md'
      - 'tests/ai-case-manifest-security.mjs'
      - 'tests/ai07-production-qa-contract.mjs'
      - 'tests/ai08-production-qa-contract.mjs'
      - 'tests/ai09-production-qa-contract.mjs'
      - '.github/workflows/ai-case-manifests.yml'
  push:
    branches: [main]
    paths:
      - 'content/ai-cases/**'
      - 'docs/ai-case-authoring-security.md'
      - 'tests/ai-case-manifest-security.mjs'
      - 'tests/ai07-production-qa-contract.mjs'
      - 'tests/ai08-production-qa-contract.mjs'
      - 'tests/ai09-production-qa-contract.mjs'
      - '.github/workflows/ai-case-manifests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spoiler-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify spoiler-safe manifests
        run: node tests/ai-case-manifest-security.mjs
      - name: Verify AI-07 production QA contract
        run: node tests/ai07-production-qa-contract.mjs
      - name: Verify AI-08 production QA contract
        run: node tests/ai08-production-qa-contract.mjs
      - name: Verify AI-09 production QA contract
        run: node tests/ai09-production-qa-contract.mjs
