name: Validate Premium Partner review mode

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/partner-premium-preview/index.html'
      - 'admin/partner-premium-preview/review.js'
      - 'supabase/functions/partner-review-v1/**'
      - '.github/workflows/partner-premium-review-mode.yml'
  push:
    branches:
      - 'feature/premium-partner-review-mode'
    paths:
      - 'admin/partner-premium-preview/index.html'
      - 'admin/partner-premium-preview/review.js'
      - 'supabase/functions/partner-review-v1/**'
      - '.github/workflows/partner-premium-review-mode.yml'

jobs:
  validate-review-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate review browser script
        run: node --check admin/partner-premium-preview/review.js
      - name: Validate review isolation contract
        run: |
          set -euo pipefail
          grep -q 'partner-review-v1' admin/partner-premium-preview/review.js
          grep -q 'REVIEW MODE' admin/partner-premium-preview/review.js
          grep -q "action:'RESET'" admin/partner-premium-preview/review.js
          grep -q './review.js' admin/partner-premium-preview/index.html
          ! grep -q 'review.js' detektivnye-igry-dlya-dvoih/ne-publikovat/index.html
          grep -q "metadata?.mode === 'review'" supabase/functions/partner-review-v1/index.ts
          grep -q "action === 'RESET'" supabase/functions/partner-review-v1/index.ts
          grep -q "action === 'REVOKE'" supabase/functions/partner-review-v1/index.ts
      - name: Type-check review Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/partner-review-v1/index.ts
