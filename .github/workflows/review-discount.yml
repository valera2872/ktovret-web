name: Validate post-case feedback

on:
  pull_request:
    paths:
      - 'ktovret-game/assets/review-discount.js'
      - 'assets/post-case-feedback.js'
      - 'assets/post-case-feedback.css'
      - 'assets/funnel-analytics.js'
      - 'assets/cognitive-coop-analytics.js'
      - 'assets/ai01-public-analytics.js'
      - 'supabase/functions/case-feedback/**'
      - 'supabase/migrations/**'
      - 'tools/validate-post-case-feedback.mjs'
      - '.github/workflows/review-discount.yml'
  push:
    branches: [main]
    paths:
      - 'ktovret-game/assets/review-discount.js'
      - 'assets/post-case-feedback.js'
      - 'assets/post-case-feedback.css'
      - 'assets/funnel-analytics.js'
      - 'assets/cognitive-coop-analytics.js'
      - 'assets/ai01-public-analytics.js'
      - 'supabase/functions/case-feedback/**'
      - 'supabase/migrations/**'
      - 'tools/validate-post-case-feedback.mjs'
      - '.github/workflows/review-discount.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check assets/post-case-feedback.js
          node --check assets/funnel-analytics.js
          node --check assets/cognitive-coop-analytics.js
          node --check assets/ai01-public-analytics.js
          node --check ktovret-game/assets/review-discount.js
      - name: Universal feedback contracts
        run: node tools/validate-post-case-feedback.mjs
      - name: No production review pollution
        run: |
          ! grep -R "audit_review_pr_" .github/workflows tools/validate-post-case-feedback.mjs
          ! grep -R "functions/v1/review-discount" .github/workflows/review-discount.yml
