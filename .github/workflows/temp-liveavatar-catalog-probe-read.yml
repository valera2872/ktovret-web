name: TEMP read LiveAvatar public avatar catalog

on:
  pull_request:
    paths:
      - '.github/workflows/temp-liveavatar-catalog-probe-read.yml'

permissions:
  contents: read

jobs:
  read-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVEAVATAR_API_KEY: ${{ secrets.LIVEAVATAR_API_KEY }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
    steps:
      - name: Read public LiveAvatar catalog safely
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://api.liveavatar.com/v1/avatars/public'
          if [ -n "${LIVEAVATAR_API_KEY:-}" ]; then
            echo 'KEY_SOURCE LIVEAVATAR_API_KEY'
            key="$LIVEAVATAR_API_KEY"
          elif [ -n "${HEYGEN_API_KEY:-}" ]; then
            echo 'KEY_SOURCE HEYGEN_API_KEY_FALLBACK'
            key="$HEYGEN_API_KEY"
          else
            echo 'KEY_SOURCE NONE'
            exit 3
          fi
          http="$(curl -sS -o /tmp/catalog.json -w '%{http_code}' -H "X-API-KEY: $key" -H 'accept: application/json' "$endpoint")"
          echo "UPSTREAM_STATUS $http"
          if [ "$http" != '200' ]; then
            node -e "const fs=require('fs');const s=fs.readFileSync('/tmp/catalog.json','utf8');console.log('ERROR_BODY',s.slice(0,1200))"
            exit 4
          fi
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          console.log('BODY_KEYS',Object.keys(body));
          const candidates=[];const seen=new Set();
          function walk(v,path='body'){
            if(!v||typeof v!=='object')return;
            if(Array.isArray(v)){v.forEach((x,i)=>walk(x,`${path}[${i}]`));return;}
            const id=String(v.avatar_id||v.avatarId||v.id||'');
            const name=String(v.name||v.avatar_name||v.avatarName||v.display_name||'');
            const preview=String(v.preview_url||v.previewUrl||v.preview_image_url||v.previewImageUrl||v.thumbnail_url||v.thumbnailUrl||v.image_url||v.imageUrl||'');
            const gender=String(v.gender||'');const type=String(v.type||v.avatar_type||v.avatarType||'');const status=String(v.status||'');
            if(id&&id.length>=8&&(name||preview||gender||type)){
              const key=`${id}|${name}|${preview}`;if(!seen.has(key)){seen.add(key);candidates.push({path,id,name,gender,type,status,preview});}
            }
            for(const [k,x] of Object.entries(v))walk(x,`${path}.${k}`);
          }
          walk(body);
          console.log('CANDIDATE_COUNT',candidates.length);
          for(const c of candidates.slice(0,300))console.log('AVATAR',JSON.stringify(c));
          console.log('RAW_SHAPE',JSON.stringify(body).slice(0,16000));
          NODE
