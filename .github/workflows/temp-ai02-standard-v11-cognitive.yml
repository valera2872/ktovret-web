name: TEMP AI-02 STANDARD v12 early-twist QA

on:
  push:
    paths:
      - '.github/workflows/temp-ai02-standard-v11-cognitive.yml'

permissions:
  contents: read

jobs:
  cognitive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run clean production cognitive path
        shell: bash
        run: |
          set -euo pipefail
          base='https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai02-full-chain-qa-probe?run=cognitive-v12&stage='
          for stage in 1; do
            echo "===== STAGE $stage ====="
            body="$(curl -fsS --retry 1 --max-time 100 "${base}${stage}")"
            echo "$body"
            BODY="$body" node -e 'const j=JSON.parse(process.env.BODY); if(j.pass!==true){console.error("STAGE FAIL", j); process.exit(1)}'
          done
