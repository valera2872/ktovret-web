name: TEMP reconcile LIVE AI storefront
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-ai02-live-reconcile-main.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai02-production-commerce-storefront-20261006
          fetch-depth: 0
      - name: Fetch current LIVE and patch feature branch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://mysterylogic.com/ -o /tmp/live-home.html
          curl -fsSL --retry 3 https://mysterylogic.com/detektivnaya-igra-s-ii/ -o /tmp/live-ai.html
          python - <<'PY'
          from pathlib import Path
          home=Path('/tmp/live-home.html').read_text()
          ai=Path('/tmp/live-ai.html').read_text()
          child=ai.replace('../','../../')
          Path('detektivnaya-igra-s-ii/vosem-minut-bez-kamery').mkdir(parents=True,exist_ok=True)
          Path('detektivnaya-igra-s-ii/vosem-minut-bez-kamery/index.html').write_text(child)
          start=home.find('<section class="ml-ai01-feature ml-ai01-feature--home"')
          if start<0: raise SystemExit('LIVE AI banner not found')
          end=home.find('</section>',start)
          if end<0: raise SystemExit('LIVE AI banner end not found')
          end+=len('</section>')
          block='''<section class="ml-ai-release-home" data-ai02-release-home data-funnel-impression="home-ai02-release" data-funnel-choice="ai-premium" data-funnel-target="ai02-home-release">
  <div class="ml-ai-release-home-media"><img src="./assets/ai02/studio3-hero.jpg?v=20261003-sharp2" alt="Студия 3 — место происшествия в новом AI-расследовании Нулевая копия" width="900" height="600" loading="eager" decoding="async"></div>
  <div class="ml-ai-release-home-copy">
    <p class="ml-ai-release-home-kicker">Новое Premium AI-расследование</p>
    <h2>Нулевая копия</h2>
    <p>Вернер найден мёртвым в монтажной студии. Но после предполагаемого времени смерти коллега слышит его голос. Допрашивайте пятерых фигурантов, проверяйте цифровые следы и докажите, что произошло на самом деле.</p>
    <div class="ml-ai-release-home-meta"><span>5 фигурантов</span><span>свободный AI-допрос</span><span>до 55 вопросов</span><span>прогресс сохраняется</span></div>
    <div class="ml-ai-release-home-actions"><a class="ml-ai-release-home-primary" href="./detektivnaya-igra-s-ii/nulevaya-kopiya/">Открыть дело — 299 ₽</a><a class="ml-ai-release-home-secondary" href="./detektivnaya-igra-s-ii/">Все AI-расследования</a></div>
  </div>
</section>'''
          home=home[:start]+block+home[end:]
          if 'ai-investigations-catalog.css' not in home:
              home=home.replace('</head>','<link rel="stylesheet" href="./assets/ai-investigations-catalog.css?v=20261006">\n</head>')
          Path('index.html').write_text(home)
          PY
      - name: Commit to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html detektivnaya-igra-s-ii/vosem-minut-bez-kamery/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconcile current LIVE home and preserve AI-01 child page"
          git push origin HEAD:feature/ai02-production-commerce-storefront-20261006
