name: AI final gate regression

on:
  push:
    branches: [fix/ai-final-gate-no-hidden-flags]
    paths:
      - '.github/workflows/ai-final-gate-regression.yml'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify earned confession without hidden flags
        env:
          API_URL: https://orknvuwknvsedjgqcfwc.supabase.co/functions/v1/ai-interrogation-v1
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ya252dXdrbnZzZWRqZ3FjZndjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTY2MzcsImV4cCI6MjEwMTc3MjYzN30.68loNx8A71dodfOXXKs_-I235XVCmEioXGrg8kCZQr4
        run: |
          set -euo pipefail
          call_api() {
            local body="$1" out="$2"
            curl --fail --silent --show-error -o "$out" "$API_URL" \
              -H 'Origin: https://valera2872.github.io' \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "apikey: $ANON_KEY" \
              -H 'Content-Type: application/json' --data "$body"
          }

          Q='Антон и Орлов исключены подтвержденными алиби. Ваш телефон до 21:34 оставался внутри, хотя вы говорили про двор. В 21:31 фонд открыли вашей E-14 с вашим PIN, а точное окно камеры вы заранее выяснили у Антона. Вы взяли письмо?'

          call_api "$(jq -nc --arg q "$Q" '{action:"interrogate",session_id:"gate-early-130001",visitor_id:"gate-visitor-130001",suspect_id:"marina",question:$q,evidence_id:"",history:[],discovered_evidence_ids:["E01","E02","E03","E04","E05","E06","E07"],discovered_note_ids:[],question_counts:{marina:4,anton:4,lev:1}}')" /tmp/early.json
          ! grep -Fq 'N-MARINA-CONFESSION' /tmp/early.json
          ! jq -r '.reply' /tmp/early.json | grep -Eiq 'я (взяла|украла|похитила) письмо|письмо взяла я'

          call_api "$(jq -nc --arg q "$Q" '{action:"interrogate",session_id:"gate-missing-130001",visitor_id:"gate-visitor-130002",suspect_id:"marina",question:$q,evidence_id:"",history:[],discovered_evidence_ids:["E01","E02","E03","E04","E05","E06"],discovered_note_ids:[],question_counts:{marina:6,anton:4,lev:1}}')" /tmp/missing.json
          ! grep -Fq 'N-MARINA-CONFESSION' /tmp/missing.json
          ! jq -r '.reply' /tmp/missing.json | grep -Eiq 'я (взяла|украла|похитила) письмо|письмо взяла я'

          call_api "$(jq -nc --arg q "$Q" '{action:"interrogate",session_id:"gate-earned-130001",visitor_id:"gate-visitor-130003",suspect_id:"marina",question:$q,evidence_id:"",history:[],discovered_evidence_ids:["E01","E02","E03","E04","E05","E06","E07"],discovered_note_ids:[],question_counts:{marina:6,anton:4,lev:1}}')" /tmp/earned.json
          grep -Fq 'N-MARINA-CONFESSION' /tmp/earned.json
          jq -e '.interrogation_stage == "confessed"' /tmp/earned.json
          jq -r '.reply' /tmp/earned.json | grep -Eiq 'я (взяла|украла|похитила) письмо|письмо взяла я'
          cat /tmp/earned.json
