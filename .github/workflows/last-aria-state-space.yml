name: Validate Last Aria State Space

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate state guard syntax
        run: |
          node --check assets/case-aria-paid-auth.js
          node --check tools/validate-last-aria-state-space.mjs
      - name: Run Last Aria state-space contract
        run: node tools/validate-last-aria-state-space.mjs
      - name: Revalidate co-op backend boundaries
        run: node tools/validate-coop-last-aria-backend.mjs
