name: Validate AI-02 commerce release

on:
  pull_request:
    paths:
      - 'supabase/functions/create-checkout-ai02/**'
      - 'supabase/functions/payment-status-ai02/**'
      - 'supabase/functions/tbank-webhook-ai02/**'
      - 'tests/ai02-commerce-release-contract.mjs'
      - '.github/workflows/ai02-commerce-release.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/create-checkout-ai02/**'
      - 'supabase/functions/payment-status-ai02/**'
      - 'supabase/functions/tbank-webhook-ai02/**'
      - 'tests/ai02-commerce-release-contract.mjs'
      - '.github/workflows/ai02-commerce-release.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract
        run: node tests/ai02-commerce-release-contract.mjs
