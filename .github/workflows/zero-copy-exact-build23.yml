name: Zero Copy Exact Build 2026-10-09.23
on:
  push:
    branches: [feature/zero-copy-runtime-final]
    paths:
      - 'qa-zero-copy/client/**'
      - '.github/workflows/zero-copy-exact-build23.yml'
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static gate
        shell: bash
        run: |
          set -euo pipefail
          cd qa-zero-copy/client
          node --check app.js
          grep -q 'staging build 2026-10-09.23' index.html
          grep -q 'v23-csp-visual-fix' index.html
          ! grep -RniE 'style=' index.html app.js
          ! grep -RniE 'Z04|Z09|Z14|Z18|corpus\.json|investigate\.php' .
          for f in assets/mikhail-ratnikov.svg assets/denis-orlov.svg assets/lev-markin.svg assets/sofia-vorontsova.svg assets/irina-belova.svg assets/anna-levina.svg assets/audio/archive-ambience.wav assets/audio/open-document.wav assets/audio/present-evidence.wav assets/audio/board-note.wav assets/audio/switch-person.wav assets/audio/final-pass.wav; do test -s "$f"; done
      - name: Build exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd qa-zero-copy/client && zip -q -r ../../dist/MysteryLogic-Zero-Copy-STAGING-BEGET-2026-10-09-build23.zip .)
          sha256sum dist/MysteryLogic-Zero-Copy-STAGING-BEGET-2026-10-09-build23.zip | tee dist/SHA256.txt
      - name: Clean unpack verify
        shell: bash
        run: |
          rm -rf /tmp/zc23 && mkdir -p /tmp/zc23
          unzip -q dist/MysteryLogic-Zero-Copy-STAGING-BEGET-2026-10-09-build23.zip -d /tmp/zc23
          diff -qr qa-zero-copy/client /tmp/zc23
          node --check /tmp/zc23/app.js
      - name: Browser install
        run: npm init -y && npm i -D playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Browser visual smoke
        shell: bash
        run: |
          python3 -m http.server 4177 --directory /tmp/zc23 >/tmp/zc23-http.log 2>&1 &
          cat > audit23.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const p=await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await p.route('**/functions/v1/**',async route=>{
            const b=JSON.parse(route.request().postData()||'{}'); const u=route.request().url();
            let out={ok:true};
            if(u.includes('zero-copy-room-v1')){
              if(b.action==='demo_create')out={room:{code:'BUILD23'},me:{role:'investigator'},bothJoined:true,state:{version:1,shared:{evidence:[],board:[],timeline:[],hypotheses:[]},mine:{evidence:[],notes:[]},interviews:{},final:null},revision:1};
              else if(b.action==='status'||b.action==='start')out={me:{role:'investigator'},role:'investigator',bothJoined:true,state:{version:1,shared:{evidence:[],board:[],timeline:[],hypotheses:[]},mine:{evidence:[],notes:[]},interviews:{},final:null},revision:1};
              else if(b.action==='meta')out={results:[{id:'scene',title:'Протокол обнаружения',kind:'Документ'},{id:'medical',title:'Справка о характере травмы',kind:'Материалы дела'},{id:'fund',title:'Финансовая записка фонда',kind:'Документ'}]};
              else if(b.action==='open')out={material:{id:b.id,title:b.id==='fund'?'Финансовая записка фонда':'Материал',kind:'Документ',text:'Тестовый текст документа.'}};
            } else if(u.includes('zero-copy-session-v1')) out={role:'investigator',bothJoined:true,state:{version:1,shared:{evidence:[],board:[],timeline:[],hypotheses:[]},mine:{evidence:[],notes:[]},interviews:{},final:null},revision:1};
            else if(u.includes('zero-copy-interrogate-v1'))out={reply:'Ответ персонажа.',mode:'ai'};
            else if(u.includes('zero-copy-final-v1'))out={passed:false,message:'Проверка.'};
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(out)});
          });
          await p.goto('http://127.0.0.1:4177/',{waitUntil:'networkidle'});
          await p.click('#demoBtn'); await p.locator('#game').waitFor({state:'visible'});
          await p.locator('#starterMaterials .starter').filter({hasText:'Финансовая записка фонда'}).click();
          await p.locator('#viewer.open').waitFor({state:'visible'});
          if(!await p.locator('#viewerNoImage .doc-paper').isVisible())throw Error('document paper missing');
          if((await p.locator('.starter-thumb-img').count())<1)throw Error('CSP-safe starter thumbnails missing');
          await p.click('#closeViewer'); await p.click('[data-view="people"]');
          if(!await p.locator('#activePersonPortrait').isVisible())throw Error('active portrait missing');
          await p.click('[data-view="board"]');
          if((await p.locator('.board-kind button').count())!==3)throw Error('board kinds missing');
          if((await p.locator('#linkBoardBtn').count())!==1)throw Error('board linker missing');
          await p.click('[data-view="final"]');
          if((await p.locator('.final-report').count())!==1)throw Error('final report missing');
          if(errors.some(x=>x.includes('Content Security Policy')))throw Error('CSP console errors: '+errors.join(' | '));
          console.log(JSON.stringify({ok:true,errors}));
          await browser.close();
          EOF
          node audit23.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: MysteryLogic-Zero-Copy-STAGING-BEGET-2026-10-09-build23
          path: |
            dist/MysteryLogic-Zero-Copy-STAGING-BEGET-2026-10-09-build23.zip
            dist/SHA256.txt
          retention-days: 14
