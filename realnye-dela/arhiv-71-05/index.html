<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Прототип документального расследования Mystery Logic: реальное дело, проверка показаний и аудит следствия.">
  <link rel="icon" href="../../assets/ml-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/mysterylogic.css">
  <link rel="stylesheet" href="../../assets/real-case-marshall.css?v=0.1.0">
  <title>Архивное дело №71-05 — прототип Mystery Logic</title>
</head>
<body class="rc-body">
  <header class="ml-brand-strip">
    <div class="ml-brand-strip-inner">
      <a class="ml-brand" href="../../" aria-label="Mystery Logic">
        <span class="ml-brand-mark">ML</span>
        <span class="ml-brand-copy"><strong>Mystery Logic</strong><small>Real cases lab</small></span>
      </a>
      <nav class="ml-brand-strip-nav" aria-label="Навигация прототипа">
        <a href="../../dela/">Другие дела</a>
        <button class="rc-header-button" type="button" data-action="open-notebook">Блокнот</button>
      </nav>
    </div>
  </header>

  <main class="rc-shell" data-realcase-app aria-live="polite">
    <section class="rc-loading">
      <span class="rc-loading-mark">71-05</span>
      <strong>Открываем архивное дело…</strong>
    </section>
  </main>

  <noscript>
    <div class="rc-noscript">Для интерактивного расследования нужен JavaScript.</div>
  </noscript>

  <script>
    (()=>{
      try{
        const params=new URLSearchParams(location.search);
        const localHost=location.hostname==='127.0.0.1'||location.hostname==='localhost';
        if(localHost&&params.has('smokeScreen')){
          const screen=Math.max(0,Math.min(25,Number(params.get('smokeScreen'))||0));
          localStorage.setItem('ml-realcase-71-05-v1',JSON.stringify({screen,maxScreen:screen,score:0}));
        }
      }catch{}
    })();
  </script>
  <script src="../../assets/real-case-marshall.js?v=0.1.0"></script>
  <script>setTimeout(()=>{document.body.dataset.rcOverflow=String(document.documentElement.scrollWidth>window.innerWidth+1)},500)</script>
</body>
</html>
