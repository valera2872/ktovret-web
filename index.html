 19:12, затем пронесли через западный выход. Внутри был пакет К-17». Синий контейнер впервые вскрыли в 19:42; внутри действительно был К-17. До вскрытия маркировка нигде не публиковалась.',question:'Какой фрагмент доказывает, что Роман солгал об источнике знания?',characters:[{id:'roman',name:'Роман',role:'сотрудник',statement:'Всё восстановил по общему экрану: исчез синий контейнер, его вынули в 19:12, пронесли через западный выход, внутри был пакет К-17.'}],answerStages:[{id:'fragment',prompt:'Выберите разоблачающий фрагмент',instruction:'Отметьте деталь, которую невозможно вывести из опубликованных данных.',selectionMode:'single',options:[{id:'blue',label:'«Исчез синий контейнер»'},{id:'time',label:'«Его вынули в 19:12»'},{id:'exit',label:'«Пронесли через западный выход»'},{id:'k17',label:'«Внутри был пакет К-17»'}],correctOptionIds:['k17']}],explanation:{shortReason:'Маркировку К-17 нельзя было вывести из общедоступных данных.',fullReason:'Два поворота помещают синий контейнер в секцию №4; время открытия дано журналом, а масса 4 кг связывает контейнер с западным выходом. Но номер внутреннего пакета оставался физически скрыт до вскрытия в 19:42. Роман назвал его в 19:18, поэтому его факты верны, а объяснение источника знания — нет.',reasoningSteps:['После двух поворотов в секции №4 оказывается синий контейнер.','Время и западный выход выводятся из журнала и таблицы масс.','Маркировка К-17 до 19:42 была недоступна, но прозвучала в записи 19:18.'],evidenceFragments:[{sourceId:'roman',quote:'Внутри был пакет К-17'},{sourceId:'intro',quote:'впервые вскрыли в 19:42'}]}}};</script><script src="./ktovret-game/assets/app.js"></script></body></html>
